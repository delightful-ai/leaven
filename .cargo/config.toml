# Parallel rustc frontend: parallelizes the front-end (parse/typeck/borrowck)
# of each crate, shortening the deep `kernel -> core -> engine -> run -> ...`
# critical path. Nightly-only; the repo pins nightly via `rust-toolchain.toml`.
# Sized to local performance cores. Cargo incremental stays enabled in
# `profile.dev`; run `just build-incremental-canary` after toolchain/profile
# changes. If incremental plus this flag regresses, remove this flag first.
[build]
rustflags = ["-Zthreads=12"]
