[project]
name = "leaven"
version = "0.1.0-alpha.0"
description = "Leaven optimization framework — Python authoring surface"
readme = "README.md"
authors = [
    { name = "Darin Kishore", email = "darinkishore@protonmail.com" },
]
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["llm", "optimization", "gepa", "dspy", "leaven", "evaluation", "agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.19",
    "pydantic>=2.10",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dspy = ["dspy-ai>=2.5"]

[project.urls]
Homepage = "https://github.com/leaven-team/leaven"
Documentation = "https://github.com/leaven-team/leaven/tree/main/docs/specs/leaven_python.md"
Repository = "https://github.com/leaven-team/leaven"

[dependency-groups]
dev = [
    "datamodel-code-generator[ruff]>=0.25",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "ty>=0.0.1a1",
]

[tool.leaven.dependency-boundaries]
public_runtime = [
    "msgspec",
    "pydantic",
    "typing-extensions",
]
public_optional = [
    "dspy-ai",
]
private_dev = [
    "datamodel-code-generator",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
]
private_runtime = []
notes = [
    "Public runtime dependencies are import-time requirements for the leaven package.",
    "Public optional dependencies are user-selected integration extras.",
    "msgspec owns private public-seam wire parsing/encoding and generated method metadata.",
    "Private dev dependencies support tests, codegen, linting, and typing only.",
    "Live provider examples use the Rust seam service process; they add no Python runtime package dependency.",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "RUF",
    "ANN", "ARG", "C4", "PIE", "PL", "PT", "RET", "TCH", "TRY", "PTH", "PERF",
    "TID251",
]
ignore = [
    "E501",    # line length handled by formatter
    "PLR0913", # SDK config/model constructors mirror public wire shape
    "PLR2004", # tests and examples use small literal expectations
    "TRY003",  # current errors keep local actionable messages at raise sites
    "TC001",   # defer type-only import migration until public surface is stable
    "TC002",   # defer type-only import migration until public surface is stable
    "TC003",   # defer type-only import migration until public surface is stable
]

[tool.ruff.lint.per-file-ignores]
"examples/08_dspy_dropin.py" = ["F401"]  # dspy is an optional dependency
"examples/run_all.py" = ["PLC0415"]      # imports inside script-runner are intentional

[tool.ruff.lint.extend-per-file-ignores]
# src/leaven/_types/ is code-generated by `just codegen`; do not lint or hand-edit.
# See codegen/README.md for known gaps in cross-file $ref resolution.
"src/leaven/_types/**" = ["ALL"]
# build/ is the codegen pipeline's scratch directory (preprocessed schemas).
"build/**" = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Leaven targets Python 3.12+; use native annotation syntax instead of future annotations."

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
testpaths = ["tests"]
