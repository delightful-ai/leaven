# The workspace builds on nightly so `.cargo/config.toml` can enable the
# parallel rustc frontend (`-Zthreads`). Cargo incremental is disabled in the
# dev profile because the pinned nightly ICEs when incremental and `-Zthreads`
# are combined.
[toolchain]
channel = "nightly"
components = [
    "rustfmt",
    "clippy",
    "llvm-tools",
    "rust-src",
]
