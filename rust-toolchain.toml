# The workspace builds on nightly so `.cargo/config.toml` can enable the
# parallel rustc frontend (`-Zthreads`). Cargo incremental is enabled in the
# dev profile and guarded by `just build-incremental-canary`.
[toolchain]
channel = "nightly"
components = [
    "rustfmt",
    "clippy",
    "llvm-tools",
    "rust-src",
]
