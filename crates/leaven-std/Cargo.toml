[package]
name = "leaven-std"
description = "Standard artifact, evidence, preference, and population implementations for leaven."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
leaven-artifact-git = { workspace = true, optional = true }
leaven-artifact-jj = { workspace = true, optional = true }
leaven-artifact-skill = { workspace = true, optional = true }
leaven-artifacts = { workspace = true }
leaven-evidence = { workspace = true }
leaven-population = { workspace = true }
leaven-preference = { workspace = true }
leaven-render = { workspace = true }
leaven-surface = { workspace = true }

[features]
default = []
git = ["dep:leaven-artifact-git"]
jj = ["dep:leaven-artifact-jj"]
skill = ["dep:leaven-artifact-skill"]
