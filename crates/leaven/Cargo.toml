[package]
name = "leaven"
description = "Optimize anything in Rust — umbrella re-exports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
leaven-core = { workspace = true }
leaven-engine = { workspace = true }
leaven-eval = { workspace = true }
leaven-run = { workspace = true }
leaven-kernel = { workspace = true }
leaven-lm = { workspace = true }
leaven-surface = { workspace = true }
leaven-agentic = { workspace = true, optional = true }
leaven-agentic-git = { workspace = true, optional = true }
leaven-agentic-skill = { workspace = true, optional = true }
leaven-artifact-skill = { workspace = true, optional = true }
leaven-gepa = { workspace = true, optional = true }
leaven-lm-cache = { workspace = true, optional = true }
leaven-lm-openai = { workspace = true, optional = true }
leaven-std = { workspace = true, optional = true }
leaven-workspace = { workspace = true, optional = true }
leaven-workspace-firkin = { workspace = true, optional = true }
leaven-workspace-git = { workspace = true, optional = true }

[features]
default = ["std", "gepa"]
std = ["dep:leaven-std"]
gepa = ["dep:leaven-gepa"]
workspace = ["dep:leaven-workspace"]
agentic = ["workspace", "dep:leaven-agentic"]
git = ["std", "leaven-std/git"]
jj = ["std", "leaven-std/jj"]
skill = ["dep:leaven-artifact-skill", "leaven-std?/skill"]
agentic-git = ["agentic", "workspace-git", "dep:leaven-agentic-git"]
agentic-skill = ["agentic", "skill", "dep:leaven-agentic-skill"]
workspace-git = ["workspace", "git", "dep:leaven-workspace-git"]
workspace-firkin = ["workspace", "dep:leaven-workspace-firkin"]
lm-openai = ["dep:leaven-lm-openai"]
lm-cache = ["dep:leaven-lm-cache"]

[dev-dependencies]
futures = { workspace = true }
leaven-evidence = { workspace = true }
serde = { workspace = true }
leaven-store-inline = { workspace = true }
