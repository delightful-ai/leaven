[package]
name = "leaven-workspace-firkin"
description = "Firkin product-pod workspace backend for Leaven."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
firkin-facade = [
    "dep:async-trait",
    "dep:firkin-e2b-contract",
    "dep:firkin-e2b-wire",
    "dep:firkin-types",
    "dep:tokio",
]

[dependencies]
async-trait = { workspace = true, optional = true }
firkin-e2b-contract = { path = "../../../../../vendor/github.com/apple/containerization/crates/e2b-contract", optional = true }
firkin-e2b-wire = { path = "../../../../../vendor/github.com/apple/containerization/crates/e2b-wire", optional = true }
firkin-types = { path = "../../../../../vendor/github.com/apple/containerization/crates/types", optional = true }
futures = { workspace = true }
leaven-kernel = { workspace = true }
leaven-workspace = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt"] }
