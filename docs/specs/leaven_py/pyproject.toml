[project]
name = "leaven"
version = "0.1.0-alpha.0"
description = "Leaven optimization framework — Python authoring surface"
readme = "README.md"
authors = [
    { name = "Darin Kishore", email = "darinkishore@protonmail.com" },
]
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["llm", "optimization", "gepa", "dspy", "leaven", "evaluation", "agents"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dspy = ["dspy-ai>=2.5"]

[project.urls]
Homepage = "https://github.com/leaven-team/leaven"
Documentation = "https://github.com/leaven-team/leaven/tree/main/docs/specs/leaven_python.md"
Repository = "https://github.com/leaven-team/leaven"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"examples/08_dspy_dropin.py" = ["F401"]  # dspy is an optional dependency
"examples/run_all.py" = ["PLC0415"]      # imports inside script-runner are intentional

[tool.ruff.lint.extend-per-file-ignores]
# Repos under docs/specs/leaven_py/repos/ are vendored reference material; never linted.
"repos/**" = ["ALL"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
