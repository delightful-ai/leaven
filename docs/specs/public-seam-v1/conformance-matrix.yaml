    fake_pass_rejected: One generic agent prompt that both critiques and writes.
    minimum_closeout_level: semantic_denial
    status: pending

  - id: ps1.stage.payload_receipts
    area: stage_payloads
    requirement: Stage payloads carry source refs, read receipts, capability fingerprints, query policy fingerprints, data classes, and allowed effects/schemas where applicable.
