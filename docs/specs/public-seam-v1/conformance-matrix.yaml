matrix_name: public-seam-v1-conformance-matrix
created_at: 2026-05-23
status: pre_goal_denominator
source_of_truth: docs/specs/public-seam-v1
purpose: >
  Convert the locked public seam specs into implementation obligations that are
  hard to satisfy with shape checks, canned examples, topology success, or goal
  prose. The specs remain the correctness standard; this matrix says what must
  be proven from them.

matrix_rules:
  - A row is not proven by schema compilation unless the row says shape_only.
  - A row is not proven by active examples unless the row says fixture_only.
  - A row touching authorization, data visibility, mutation, receipts, costs, or replay must include a negative proof.
  - A row touching public exports, default features, or facades must include route maturity classification.
  - A row touching worker behavior must prove ACP profile behavior, not a private Rust-only shortcut.
  - A row touching archived or downloaded drafts must prove hard cutover to this package.

proof_levels:
  shape_only: JSON Schema, examples, or generated types prove only syntactic acceptance.
  structural_contract: Public Rust/API shape exists and round-trips the locked contract vocabulary.
  semantic_denial: The implementation rejects forbidden behavior and returns typed errors/redactions/receipts.
  integrated_surface: The intended worker or user-facing flow exercises the seam through the owning public route.

row_status_values:
  pending: No implementation proof yet.
  in_progress: Implementation or verification is underway.
  proven: Evidence exists and is linked from the row.
  blocked: Cannot be proven without a missing decision or dependency.
  dropped: Removed from V1 scope by a spec or manifest revision.

rows:
  - id: ps1.authority.active_package_only
    area: authority
    requirement: >
      The active docs/specs/public-seam-v1 package is the only V1 correctness
      standard; archived repo drafts and downloaded zips are provenance only.
    spec_refs:
      - docs/specs/public-seam-v1/README.md
      - docs/specs/public-seam-v1/manifest.json
      - docs/specs/public-seam-v1/goal-readiness-gate.yaml
    owner_boundary: docs/specs plus the eventual public-seam implementation owner
    positive_proof: >
      Runtime/spec loading resolves schemas, manifest facts, and conformance
      requirements only from docs/specs/public-seam-v1 or embedded artifacts
      generated from that package.
    negative_proof: >
      Older archived or downloaded payload variants are rejected unless the
      active manifest is deliberately revised in the same change.
    fake_pass_rejected: Loading whichever draft schema happens to validate.
    minimum_closeout_level: semantic_denial
    positive_test_evidence:
      - crates/leaven-public-seam/tests/contract_package.rs::active_package_loader_accepts_only_locked_public_seam_v1_package
    negative_test_evidence:
      - crates/leaven-public-seam/tests/contract_package.rs::active_package_loader_accepts_only_locked_public_seam_v1_package
    implementation_evidence:
      - crates/leaven-public-seam/tests/contract_package.rs::active_package_loader_accepts_only_locked_public_seam_v1_package
      - crates/leaven-public-seam/src/package.rs::PublicSeamPackage::from_path
    review_evidence:
      - docs/specs/public-seam-v1/reviews/2026-05-23-initial-contract-owner-review.md
    status: proven

  - id: ps1.authority.manifest_inventory
    area: authority
    requirement: >
      The manifest is the discoverable inventory for active schemas, profile,
      statuses, goal gate, and conformance matrix.
    spec_refs:
      - docs/specs/public-seam-v1/manifest.json
    owner_boundary: public-seam implementation owner
    positive_proof: >
      A contract-inventory test loads manifest.json and checks every listed
      schema/profile/gate/matrix path exists and is used by the harness.
    negative_proof: >
      Removing or renaming a listed contract file fails the inventory test.
    fake_pass_rejected: A hand-maintained test list that silently diverges from the manifest.
    minimum_closeout_level: structural_contract
    implementation_evidence:
      - crates/leaven-public-seam/tests/contract_package.rs::manifest_inventory_drives_contract_file_loading
      - crates/leaven-public-seam/src/package.rs::PublicSeamPackage::inventory
    review_evidence:
      - docs/specs/public-seam-v1/reviews/2026-05-23-initial-contract-owner-review.md
    status: proven

  - id: ps1.schema.fingerprints
    area: schema
    requirement: Schema fingerprints use RFC 8785 JCS plus SHA-256.
    spec_refs:
      - docs/specs/public-seam-v1/manifest.json
      - docs/specs/public-seam-v1/schemas/common.schema.json
    owner_boundary: public-seam implementation owner with kernel/core fingerprint primitives
    positive_proof: >
      Canonicalization tests compute schema fingerprints from JSON values using
      RFC 8785 JCS and SHA-256, and compare them to expected fp_schema_sha256
      forms.
    negative_proof: >
      Whitespace changes keep the fingerprint stable, while semantically
      different JSON changes the fingerprint; ad hoc pretty-printed hashing is
      rejected.
    fake_pass_rejected: Accepting strings that look like fingerprints without computing them.
    minimum_closeout_level: semantic_denial
    positive_test_evidence:
      - crates/leaven-public-seam/tests/contract_package.rs::schema_fingerprints_reject_pretty_printed_hashing_and_track_semantic_changes
    negative_test_evidence:
      - crates/leaven-public-seam/tests/contract_package.rs::schema_fingerprints_reject_pretty_printed_hashing_and_track_semantic_changes
    implementation_evidence:
      - crates/leaven-public-seam/tests/contract_package.rs::schema_fingerprints_reject_pretty_printed_hashing_and_track_semantic_changes
      - crates/leaven-public-seam/src/fingerprint.rs::SchemaFingerprint::for_json_value
    review_evidence:
      - docs/specs/public-seam-v1/reviews/2026-05-23-initial-contract-owner-review.md
    status: proven

