matrix_name: public-seam-v1-conformance-matrix
created_at: 2026-05-23
status: pre_goal_denominator
source_of_truth: docs/specs/public-seam-v1
purpose: >
  Convert the locked public seam specs into implementation obligations that are
  hard to satisfy with shape checks, canned examples, topology success, or goal
  prose. The specs remain the correctness standard; this matrix says what must
  be proven from them.

matrix_rules:
  - A row is not proven by schema compilation unless the row says shape_only.
  - A row is not proven by active examples unless the row says fixture_only.
  - A row touching authorization, data visibility, mutation, receipts, costs, or replay must include a negative proof.
  - A row touching public exports, default features, or facades must include route maturity classification.
  - A row touching worker behavior must prove ACP profile behavior, not a private Rust-only shortcut.
  - A row touching archived or downloaded drafts must prove hard cutover to this package.

proof_levels:
  shape_only: JSON Schema, examples, or generated types prove only syntactic acceptance.
  structural_contract: Public Rust/API shape exists and round-trips the locked contract vocabulary.
  semantic_denial: The implementation rejects forbidden behavior and returns typed errors/redactions/receipts.
  integrated_surface: The intended worker or user-facing flow exercises the seam through the owning public route.

row_status_values:
  pending: No implementation proof yet.
  in_progress: Implementation or verification is underway.
  proven: Evidence exists and is linked from the row.
  blocked: Cannot be proven without a missing decision or dependency.
  dropped: Removed from V1 scope by a spec or manifest revision.

rows:
  - id: ps1.authority.active_package_only
    area: authority
    requirement: >
      The active docs/specs/public-seam-v1 package is the only V1 correctness
      standard; archived repo drafts and downloaded zips are provenance only.
    spec_refs:
      - docs/specs/public-seam-v1/README.md
      - docs/specs/public-seam-v1/manifest.json
      - docs/specs/public-seam-v1/goal-readiness-gate.yaml
    owner_boundary: docs/specs plus the eventual public-seam implementation owner
    positive_proof: >
      Runtime/spec loading resolves schemas, manifest facts, and conformance
      requirements only from docs/specs/public-seam-v1 or embedded artifacts
      generated from that package.
    negative_proof: >
      Older archived or downloaded payload variants are rejected unless the
      active manifest is deliberately revised in the same change.
    fake_pass_rejected: Loading whichever draft schema happens to validate.
    minimum_closeout_level: semantic_denial
    positive_test_evidence:
      - crates/leaven-public-seam/tests/contract_package.rs::active_package_loader_accepts_only_locked_public_seam_v1_package
    negative_test_evidence:
      - crates/leaven-public-seam/tests/contract_package.rs::active_package_loader_accepts_only_locked_public_seam_v1_package
    implementation_evidence:
      - crates/leaven-public-seam/tests/contract_package.rs::active_package_loader_accepts_only_locked_public_seam_v1_package
      - crates/leaven-public-seam/src/package.rs::PublicSeamPackage::from_path
    review_evidence:
      - docs/specs/public-seam-v1/reviews/2026-05-23-initial-contract-owner-review.md
    status: proven

  - id: ps1.authority.manifest_inventory
    area: authority
    requirement: >
      The manifest is the discoverable inventory for active schemas, profile,
      statuses, goal gate, and conformance matrix.
    spec_refs:
      - docs/specs/public-seam-v1/manifest.json
    owner_boundary: public-seam implementation owner
    positive_proof: >
      A contract-inventory test loads manifest.json and checks every listed
      schema/profile/gate/matrix path exists and is used by the harness.
    negative_proof: >
      Removing or renaming a listed contract file fails the inventory test.
    fake_pass_rejected: A hand-maintained test list that silently diverges from the manifest.
    minimum_closeout_level: structural_contract
    implementation_evidence:
      - crates/leaven-public-seam/tests/contract_package.rs::manifest_inventory_drives_contract_file_loading
      - crates/leaven-public-seam/src/package.rs::PublicSeamPackage::inventory
    review_evidence:
      - docs/specs/public-seam-v1/reviews/2026-05-23-initial-contract-owner-review.md
    status: proven

  - id: ps1.schema.fingerprints
    area: schema
    requirement: Schema fingerprints use RFC 8785 JCS plus SHA-256.
    spec_refs:
      - docs/specs/public-seam-v1/manifest.json
      - docs/specs/public-seam-v1/schemas/common.schema.json
    owner_boundary: public-seam implementation owner with kernel/core fingerprint primitives
    positive_proof: >
      Canonicalization tests compute schema fingerprints from JSON values using
      RFC 8785 JCS and SHA-256, and compare them to expected fp_schema_sha256
      forms.
    negative_proof: >
      Whitespace changes keep the fingerprint stable, while semantically
      different JSON changes the fingerprint; ad hoc pretty-printed hashing is
      rejected.
    fake_pass_rejected: Accepting strings that look like fingerprints without computing them.
    minimum_closeout_level: semantic_denial
    positive_test_evidence:
      - crates/leaven-public-seam/tests/contract_package.rs::schema_fingerprints_reject_pretty_printed_hashing_and_track_semantic_changes
    negative_test_evidence:
      - crates/leaven-public-seam/tests/contract_package.rs::schema_fingerprints_reject_pretty_printed_hashing_and_track_semantic_changes
    implementation_evidence:
      - crates/leaven-public-seam/tests/contract_package.rs::schema_fingerprints_reject_pretty_printed_hashing_and_track_semantic_changes
      - crates/leaven-public-seam/src/fingerprint.rs::SchemaFingerprint::for_json_value
    review_evidence:
      - docs/specs/public-seam-v1/reviews/2026-05-23-initial-contract-owner-review.md
    status: proven

  - id: ps1.plan.ir_family
    area: plan_ir
    requirement: Plan IR is the locked Let/Call/Write value family with typed query, call, and write variants.
    spec_refs:
      - docs/specs/public-seam-v1/01_plan_ir_spec_v0.3.md
      - docs/specs/public-seam-v1/schemas/leaven.plan.v1.schema.json
    conformance_tests:
      - reject_unknown_core_kind_values
    owner_boundary: public-seam implementation owner; cold algebra must not absorb transport/runtime details
    positive_proof: >
      Contract tests deserialize, validate, lower, and execute representative
      let/call/write plans through the owning seam surface.
    negative_proof: >
      Unknown core kinds, unknown write kinds, and untyped escape-hatch payloads
      are rejected before execution.
    fake_pass_rejected: Generated structs that round-trip JSON but are never executable.
    minimum_closeout_level: semantic_denial
    status: pending

  - id: ps1.plan.pinned_dialects
    area: plan_ir
    requirement: Field paths, extraction, and templates are pinned to JSON Pointer, Leaven JSONPath subset, and leaven.mustache.strict.v1.
    spec_refs:
      - docs/specs/public-seam-v1/01_plan_ir_spec_v0.3.md
      - docs/specs/public-seam-v1/schemas/common.schema.json
      - docs/specs/public-seam-v1/schemas/leaven.plan.v1.schema.json
    conformance_tests:
      - reject_graph_query_unpinned_path_syntax
      - reject_template_dialects_other_than_leaven_mustache_strict_v1
      - reject_extraction_dialects_outside_leaven_jsonpath_subset
    owner_boundary: public-seam implementation owner
    positive_proof: >
      Valid pinned pointer, extraction, and template operations are parsed and
      replayed with deterministic results.
    negative_proof: >
      Unpinned path syntax, non-Leaven JSONPath dialects, and non-strict
      Mustache dialects are rejected with typed PlanError.
    fake_pass_rejected: Treating path/template strings as opaque user prose.
    minimum_closeout_level: semantic_denial
    positive_test_evidence:
      - crates/leaven-public-seam/tests/plan_dialects.rs::pinned_dialects_replay_pointer_jsonpath_and_template_deterministically
      - crates/leaven-public-seam/tests/plan_dialects.rs::pinned_dialects_do_not_inspect_arbitrary_json_data_slots
    negative_test_evidence:
      - crates/leaven-public-seam/tests/plan_dialects.rs::pinned_dialects_reject_unpinned_or_executable_syntax
    implementation_evidence:
      - crates/leaven-public-seam/src/dialect.rs::PinnedDialectEvaluator
      - crates/leaven-public-seam/src/package.rs::PublicSeamPackage::pinned_dialects
      - crates/leaven-public-seam/src/plan.rs::PlanDocument::pinned_pointer_count
      - crates/leaven-public-seam/src/plan.rs::PlanDocument::pinned_jsonpath_count
      - crates/leaven-public-seam/src/plan.rs::PlanDocument::strict_template_count
      - crates/leaven-public-seam/AGENTS.md
    review_evidence:
      - docs/specs/public-seam-v1/reviews/2026-05-23-plan-pinned-dialects-review.md
    status: proven

  - id: ps1.plan.revision_modes
    area: plan_ir
    requirement: Plans honor latest_at_start, at_revision, and since_revision consistency modes.
    spec_refs:
      - docs/specs/public-seam-v1/01_plan_ir_spec_v0.3.md
      - docs/specs/public-seam-v1/schemas/leaven.plan.v1.schema.json
      - docs/specs/public-seam-v1/08_watch_deferred_v1.1.md
    conformance_tests:
      - accept_final_revision_base_revision_for_read_only_plans
    owner_boundary: engine/run context plus public-seam implementation owner
    positive_proof: >
      Query tests show each consistency mode reads the intended graph revision
      or finite diff set.
    negative_proof: >
      A since_revision request without a valid base revision is rejected instead
      of falling back to latest.
    fake_pass_rejected: Always reading the current graph and labeling it consistent.
    minimum_closeout_level: semantic_denial
    status: pending

  - id: ps1.plan.execution_modes
    area: plan_ir
    requirement: execute, dry_run, require_cached, and replay modes have distinct side-effect behavior.
    spec_refs:
      - docs/specs/public-seam-v1/01_plan_ir_spec_v0.3.md
      - docs/specs/public-seam-v1/schemas/leaven.plan.v1.schema.json
    owner_boundary: engine/run context plus public-seam implementation owner
    positive_proof: >
      Mode tests prove execute may call/write, dry_run validates without graph
      mutation, require_cached refuses cache misses, and replay uses receipts.
    negative_proof: >
      A dry_run write cannot mutate RunGraph, and require_cached cannot perform
      live LM/agent/sandbox work.
    fake_pass_rejected: A mode enum that is serialized but ignored.
    minimum_closeout_level: semantic_denial
    status: pending

  - id: ps1.graph.runcontext_mutation_only
    area: graph_mutation
    requirement: RunContext is the only graph mutation authority across the public seam.
    spec_refs:
      - docs/specs/public-seam-v1/00_architecture_judgment_v0.3.md
      - docs/specs/public-seam-v1/01_plan_ir_spec_v0.3.md
    owner_boundary: crates/leaven-engine plus public-seam implementation owner
    positive_proof: >
      Proposal and assessment writes enter the graph through RunContext and emit
      write receipts tied to graph revisions.
    negative_proof: >
      Worker callbacks, deserialized plan writes, and adapter helpers cannot
      mutate RunGraph directly or bypass RunContext validation.
    fake_pass_rejected: Public seam code importing graph internals for convenience.
    minimum_closeout_level: semantic_denial
    status: pending

  - id: ps1.result.typed_envelope
    area: result_receipts
    requirement: Plan results carry typed values, typed receipts, started_at/completed_at, capability/policy fingerprints, data classes, and closed PlanError.
    spec_refs:
      - docs/specs/public-seam-v1/03_result_receipts_spec_v0.3.md
      - docs/specs/public-seam-v1/schemas/leaven.plan_result.v1.schema.json
      - docs/specs/public-seam-v1/schemas/common.schema.json
    owner_boundary: public-seam implementation owner with kernel/core error vocabulary
    positive_proof: >
      Success and failure plan runs produce schema-valid PlanResult values with
      typed values, receipts, timing, fingerprints, data classes, and errors.
    negative_proof: >
      Unknown error kinds, missing timing, missing fingerprints, and untyped
      error strings are rejected at the public seam.
    fake_pass_rejected: Logging errors while returning a generic JSON blob.
    minimum_closeout_level: semantic_denial
    status: pending

  - id: ps1.receipts.audit_currency
    area: result_receipts
    requirement: Query, call, and write receipts are audit currency, not log decoration.
    spec_refs:
      - docs/specs/public-seam-v1/03_result_receipts_spec_v0.3.md
      - docs/specs/public-seam-v1/schemas/leaven.plan_result.v1.schema.json
    owner_boundary: engine/run context plus public-seam implementation owner
    positive_proof: >
      Receipts include operation kind, request/op hash, result hash, status,
      policy fingerprints, and revision or runtime binding as applicable.
    negative_proof: >
      A result value that references a missing receipt, mismatched hash, or
      wrong operation kind fails validation or replay.
    fake_pass_rejected: Receipt ids that are only decorative log correlation ids.
    minimum_closeout_level: semantic_denial
    status: pending

  - id: ps1.receipts.failed_costs
    area: result_receipts
    requirement: Failed calls that spend money still produce call and charge receipts.
    spec_refs:
      - docs/specs/public-seam-v1/03_result_receipts_spec_v0.3.md
      - docs/specs/public-seam-v1/schemas/leaven.plan_result.v1.schema.json
    owner_boundary: engine budget/cost ledger plus public-seam implementation owner
    positive_proof: >
      A controlled failing LM/agent/sandbox call that incurs cost returns a
      failed call receipt and charge receipt.
    negative_proof: >
      The same failure cannot disappear from cost totals or replay provenance.
    fake_pass_rejected: Counting only successful calls as receipted work.
    minimum_closeout_level: semantic_denial
    status: pending

  - id: ps1.replay.per_assessment
    area: replayability
    requirement: Assessment batches carry per-assessment replayability and plan-level replayability is only a roll-up.
    spec_refs:
      - docs/specs/public-seam-v1/03_result_receipts_spec_v0.3.md
      - docs/specs/public-seam-v1/schemas/leaven.plan_result.v1.schema.json
    conformance_tests:
      - accept_per_assessment_mixed_replayability_compute_plan_roll_up_summary
    owner_boundary: evaluator/run result layer plus public-seam implementation owner
    positive_proof: >
      Mixed replayable and non-replayable assessments produce per-assessment
      statuses and a correct plan-level summary.
    negative_proof: >
      A plan-level replayable flag cannot hide one non-replayable assessment.
    fake_pass_rejected: A single boolean replayability result for the whole plan.
    minimum_closeout_level: semantic_denial
    status: pending

  - id: ps1.capability.document_truth
    area: capability
    requirement: A capability token resolves to structured audit truth with jti, subject fingerprint, binding, expiry, renewal, revocation, grants, delegation, and budgets.
    spec_refs:
      - docs/specs/public-seam-v1/00_architecture_judgment_v0.3.md
      - docs/specs/public-seam-v1/02_capability_spec_v0.3.md
      - docs/specs/public-seam-v1/schemas/leaven.capability.v1.schema.json
    owner_boundary: engine trust/budget layer plus public-seam implementation owner
    positive_proof: >
      Authentication resolves an opaque or signed token into the schema-valid
      capability document used for all later permission decisions.
    negative_proof: >
      A bare token string, missing subject fingerprint, expired token, revoked
      token, or binding mismatch is denied before the call executes.
    fake_pass_rejected: Passing token strings around as authorization facts.
    minimum_closeout_level: semantic_denial
    positive_test_evidence:
      - crates/leaven-public-seam/tests/capability_document.rs::opaque_token_resolves_to_structured_capability_document
    negative_test_evidence:
      - crates/leaven-public-seam/tests/capability_document.rs::capability_resolution_rejects_bare_missing_expired_revoked_and_mismatched_tokens
      - crates/leaven-public-seam/tests/capability_document.rs::capability_documents_must_satisfy_locked_schema_not_partial_struct_shape
    implementation_evidence:
      - crates/leaven-public-seam/src/capability.rs::CapabilityDocument::from_value
      - crates/leaven-public-seam/src/capability.rs::CapabilityRegistry::resolve_opaque_for_new_operation
      - crates/leaven-public-seam/src/capability.rs::Grant
    review_evidence:
      - docs/specs/public-seam-v1/reviews/2026-05-23-capability-document-review.md
    status: proven

  - id: ps1.capability.grant_enforcement
    area: capability
    requirement: Capability grants enforce action, resource, case fields, partitions, schemas, surface fingerprints, data classes, and limits.
    spec_refs:
      - docs/specs/public-seam-v1/02_capability_spec_v0.3.md
      - docs/specs/public-seam-v1/schemas/leaven.capability.v1.schema.json
      - docs/specs/public-seam-v1/examples/evaluator_capability.v0.3.example.json
    owner_boundary: engine trust layer plus public-seam implementation owner
    positive_proof: >
      Allowed calls succeed only inside their grant envelope and return the
      relevant capability fingerprint.
    negative_proof: >
      Calls outside action, resource, partition, case-field, schema, data-class,
      or limit constraints return typed denials and redactions.
    fake_pass_rejected: Checking only that a token exists.
    minimum_closeout_level: semantic_denial
    positive_test_evidence:
      - crates/leaven-public-seam/tests/capability_document.rs::allowed_grant_request_returns_capability_fingerprint_and_effective_limits
    negative_test_evidence:
      - crates/leaven-public-seam/tests/capability_document.rs::grant_enforcement_rejects_under_specified_requests
      - crates/leaven-public-seam/tests/capability_document.rs::grant_enforcement_rejects_action_resource_case_schema_data_class_and_limits
      - crates/leaven-public-seam/tests/capability_document.rs::grant_enforcement_rejects_timeout_and_row_limit_overruns
    implementation_evidence:
      - crates/leaven-public-seam/src/capability.rs::CapabilityDocument::authorize_grant
      - crates/leaven-public-seam/src/capability.rs::CapabilityGrantRequest
      - crates/leaven-public-seam/src/capability.rs::CapabilityLimitUsage
      - crates/leaven-public-seam/src/capability.rs::CapabilityDenial
      - crates/leaven-public-seam/src/capability.rs::AuthorizedGrant
      - crates/leaven-public-seam/AGENTS.md
    review_evidence:
      - docs/specs/public-seam-v1/reviews/2026-05-23-capability-grant-enforcement-review.md
    status: proven

  - id: ps1.capability.delegation_attenuates
    area: capability
    requirement: Delegated tokens cannot widen action, resource, budget, data class, schema, expiry, or binding authority.
    spec_refs:
      - docs/specs/public-seam-v1/02_capability_spec_v0.3.md
      - docs/specs/public-seam-v1/schemas/leaven.capability.v1.schema.json
      - docs/specs/public-seam-v1/notes/CONFORMANCE_TESTS_v0.3.md
    conformance_tests:
      - reject_delegated_token_widens_any_action_resource_budget_data_class_schema
    owner_boundary: public-seam semantic validation owner; engine trust layer remains runtime owner for minting, ledgers, ACP, and session behavior
    positive_proof: >
      Valid delegation narrows authority and records parent capability lineage.
    negative_proof: >
      Delegation attempts that widen any constrained dimension are rejected.
    fake_pass_rejected: Issuing fresh full-power child tokens from any valid parent.
    minimum_closeout_level: semantic_denial
    positive_test_evidence:
      - crates/leaven-public-seam/tests/capability_document.rs::valid_delegation_narrows_authority_and_records_parent_lineage
    negative_test_evidence:
      - crates/leaven-public-seam/tests/capability_document.rs::delegation_rejects_widened_action_resource_budget_data_class_schema_expiry_and_binding
    implementation_evidence:
      - crates/leaven-public-seam/src/capability.rs::CapabilityDocument::validate_delegation
      - crates/leaven-public-seam/src/capability.rs::CapabilityDelegation
      - crates/leaven-public-seam/src/capability.rs::ensure_binding_attenuates
      - crates/leaven-public-seam/src/capability.rs::ensure_budget_attenuates
      - crates/leaven-public-seam/src/capability.rs::ensure_resource_attenuates
      - crates/leaven-public-seam/src/capability.rs::ensure_constraints_attenuate
      - crates/leaven-public-seam/src/capability.rs::ensure_grant_limits_attenuate
      - crates/leaven-public-seam/src/capability.rs::ensure_delegation_policy_attenuates
      - crates/leaven-public-seam/AGENTS.md
    review_evidence:
      - docs/specs/public-seam-v1/reviews/2026-05-23-capability-delegation-review.md
    status: proven

  - id: ps1.capability.aggregate_budgets
    area: capability
    requirement: Aggregate budgets and concurrent-call limits are enforced across LM, agent, sandbox, evaluator, and delegated work.
    spec_refs:
      - docs/specs/public-seam-v1/02_capability_spec_v0.3.md
      - docs/specs/public-seam-v1/schemas/leaven.capability.v1.schema.json
    owner_boundary: engine budget ledger plus public-seam implementation owner
    positive_proof: >
      Budget tests spend across multiple call types and show aggregate totals,
      role-specific totals, and concurrency limits being enforced.
    negative_proof: >
      Delegated or nested calls cannot exceed the parent's aggregate budget or
      bypass concurrency limits.
    fake_pass_rejected: Per-call max checks with no aggregate accounting.
    minimum_closeout_level: semantic_denial
    status: pending

  - id: ps1.visibility.data_class_propagation
    area: data_visibility
    requirement: Data classes propagate monotonically by default and forbidden intersections deny calls.
    spec_refs:
      - docs/specs/public-seam-v1/00_architecture_judgment_v0.3.md
      - docs/specs/public-seam-v1/02_capability_spec_v0.3.md
      - docs/specs/public-seam-v1/schemas/common.schema.json
    conformance_tests:
      - reject_call_data_classes_intersect_forbidden_input_classes
    owner_boundary: engine trust layer, evidence layer, public-seam implementation owner
    positive_proof: >
      Query, call, and write values carry accumulated data classes through
      projections, templates, LM calls, agent runs, evidence, and receipts.
    negative_proof: >
      A call whose input classes intersect forbidden classes is denied before
      execution and reports redactions.
    fake_pass_rejected: Checking data classes only at initial case read.
    minimum_closeout_level: semantic_denial
    status: pending

  - id: ps1.visibility.reflector_target_safe
    area: data_visibility
    requirement: Reflectors receive target-safe projections and cannot read case.target directly or through LM prompts.
    spec_refs:
      - docs/specs/public-seam-v1/04_stage_payloads_spec_v0.3.md
      - docs/specs/public-seam-v1/notes/CONFORMANCE_TESTS_v0.3.md
    conformance_tests:
      - reject_reflector_reads_case_target
      - reject_reflector_lm_call_input_classes_include_case_target
    owner_boundary: agentic/stage lowering plus public-seam implementation owner
    positive_proof: >
      ReflectRequest construction uses target-safe examples and carries source
      refs, read receipts, and data classes.
    negative_proof: >
      Reflector case.target reads and reflector LM calls containing case.target
      data classes are denied.
    fake_pass_rejected: Hiding targets in side_info or prompt text after projection.
    minimum_closeout_level: semantic_denial
    status: pending

  - id: ps1.evidence.visibility_receipts
    area: evidence
    requirement: Evidence visibility lives in values and receipts, and target-derived evidence carries data classes.
    spec_refs:
      - docs/specs/public-seam-v1/00_architecture_judgment_v0.3.md
      - docs/specs/public-seam-v1/schemas/leaven.evidence_envelope.v1.schema.json
    conformance_tests:
      - reject_evidence_envelope_target_derived_true_no_data_classes
    owner_boundary: crates/leaven-evidence plus public-seam implementation owner
    positive_proof: >
      Evidence envelopes preserve visibility, data classes, source values, and
      receipt refs through public result projection.
    negative_proof: >
      A target_derived envelope with missing data classes, or an evidence value
      whose receipt visibility conflicts with its value visibility, is rejected.
    fake_pass_rejected: Treating visibility as policy metadata that never reaches results.
    minimum_closeout_level: semantic_denial
    status: pending

  - id: ps1.stage.reflection_proposal_split
    area: stage_payloads
    requirement: Reflection and proposal are separate stages; ProposeRequest consumes ReflectionResult instead of merging diagnosis and mutation.
    spec_refs:
      - docs/specs/public-seam-v1/00_architecture_judgment_v0.3.md
      - docs/specs/public-seam-v1/04_stage_payloads_spec_v0.3.md
      - docs/specs/public-seam-v1/examples/reflect_then_propose.example.json
    owner_boundary: agentic/stage lowering plus public-seam implementation owner
    positive_proof: >
      ReflectRequest, ReflectionResult, and ProposeRequest each validate and
      lower through distinct types and execution steps.
    negative_proof: >
      A proposer payload that embeds unreceipted diagnosis or mutates graph
