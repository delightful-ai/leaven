      - reject_unknown_core_kind_values
    owner_boundary: public-seam implementation owner; cold algebra must not absorb transport/runtime details
    positive_proof: >
      Contract tests deserialize, validate, lower, and execute representative
      let/call/write plans through the owning seam surface.
    negative_proof: >
      Unknown core kinds, unknown write kinds, and untyped escape-hatch payloads
      are rejected before execution.
    fake_pass_rejected: Generated structs that round-trip JSON but are never executable.
    minimum_closeout_level: semantic_denial
    positive_test_evidence:
