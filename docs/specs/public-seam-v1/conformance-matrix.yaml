    requirement: Field paths, extraction, and templates are pinned to JSON Pointer, Leaven JSONPath subset, and leaven.mustache.strict.v1.
    spec_refs:
      - docs/specs/public-seam-v1/01_plan_ir_spec_v0.3.md
      - docs/specs/public-seam-v1/schemas/common.schema.json
      - docs/specs/public-seam-v1/schemas/leaven.plan.v1.schema.json
    conformance_tests:
      - reject_graph_query_unpinned_path_syntax
      - reject_template_dialects_other_than_leaven_mustache_strict_v1
      - reject_extraction_dialects_outside_leaven_jsonpath_subset
    owner_boundary: public-seam implementation owner
    positive_proof: >
      Valid pinned pointer, extraction, and template operations are parsed and
      replayed with deterministic results.
    negative_proof: >
      Unpinned path syntax, non-Leaven JSONPath dialects, and non-strict
      Mustache dialects are rejected with typed PlanError.
    fake_pass_rejected: Treating path/template strings as opaque user prose.
    minimum_closeout_level: semantic_denial
    positive_test_evidence:
