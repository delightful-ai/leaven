      - kind: private_seam_json_builder_branding
        commits:
          - 414f7d0d
        paths:
          - sdk/python/src/leaven/_seam/plans.py
          - sdk/python/src/leaven/_seam/config.py
          - sdk/python/src/leaven/_seam/capability.py
