          transport ingress, nested domain payloads, ACP result payloads,
          event payloads, costs, blob refs, metadata/info refs, stage case
          inputs outside the runner facts owner, and nested Plan Result bodies
          remain raw JSON islands that must be eliminated before typed-seam
          closeout; there is no standing approval for those internal islands.
    closeout_check: >-
      Handwritten Python schema mirrors, pydantic-only wire models, untyped
      dict payloads, response-order batch routing, or msgspec used as a
      transport/client abstraction cannot close this row.

  - id: python_sdk_project_quality_gate
    claim: >-
      The Python SDK is a real modular typed project with explicit dependency
      boundaries and production-ready public backbone surfaces.
    status: pending
    proof_required:
      kind: sdk_lint_type_package_contract
      must_exercise:
        - "`uv` project metadata, lockfile, package build/import, and `py.typed`"
        - public vs private module map and `__all__` discipline
        - public/runtime, optional, private/dev dependency declarations
        - "`msgspec` declared in the correct public/private dependency bucket for the generated wire codec layer"
        - no public `leaven/*` backbone method that only raises `NotImplementedError`
        - no `typing.Any` on public SDK APIs or public-seam wire boundaries
        - explicit JSON/value aliases or pydantic models instead of untyped dicts
        - Python 3.12+ native syntax; no `from __future__ import annotations`
        - Ruff enabled for maintainability families including ANN, ARG, C4, PIE, PL, PT, RET, TCH, TRY, PTH, PERF, and ANN401
        - "`uv run ty check ...`"
        - no checked-in non-generated Python file over 650 LOC
        - Python unit/example/law tests mirror source module paths outside `src`, with integration/scenario tests and shared fixtures split into explicit support locations
    evidence:
      - kind: focused_sdk_quality_foundation
        paths:
          - sdk/python/pyproject.toml
          - sdk/python/AGENTS.md
          - sdk/python/src/leaven/_seam/AGENTS.md
          - sdk/python/src/leaven/_seam/client.py
          - sdk/python/src/leaven/_seam/_wire/
          - sdk/python/tests/AGENTS.md
