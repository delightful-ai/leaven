        - deterministic codegen into split Python modules, not one giant file
        - "msgspec `Struct` records for JSON-RPC envelopes and method payload/result types"
        - "explicit `JsonValue`/extension aliases instead of `typing.Any` on public or wire boundaries"
        - "`UNSET`-style missing-vs-null handling for JSON-RPC result/error fields"
        - method-specific result decoding from raw payload bytes after the outer envelope is parsed
        - batch response routing by `id`, never by response order
        - codec tests for malformed envelopes, both result+error, neither result nor error, unknown methods, null ids, notifications, and typed method payload failures
        - transport separation: stdio/http/client routing is outside the msgspec codec layer
        - generated-code line-count split policy under the 650 LOC Python gate
