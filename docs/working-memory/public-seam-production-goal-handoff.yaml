          - cd sdk/python && uv run python -c "import leaven; print('import ok', 'SeamClient' not in dir(leaven))"
          - wc -l $(rg --files sdk/python/src sdk/python/tests sdk/python/codegen -g '*.py') | sort -nr | head -12
        note: >-
          msgspec is declared as a runtime dependency for the private generated
          seam wire codec, `_seam.client` now consumes that codec instead of
          raw JSON-RPC loads/dumps, test placement mirrors `_seam._wire`, and
          the checked-in Python file-count scan now shows the largest file at
          exactly 650 lines. The broader project-quality row remains pending
          until all public SDK/wire `Any` and public backbone scaffolds are
          audited and removed or explicitly kept private.
      - kind: sdk_quality_gate_lint_type_tests_package
        paths:
          - sdk/python/pyproject.toml
          - sdk/python/justfile
          - sdk/python/scripts/check_quality_contract.py
          - sdk/python/src/leaven/_seam_optimize/
          - sdk/python/src/leaven/_seam_worker/
          - sdk/python/src/leaven/_stage_runtime/
          - sdk/python/src/leaven/x/dspy/
          - sdk/python/examples/
          - sdk/python/tests/
        commands:
