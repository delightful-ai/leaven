          `leaven seam profile` JSON export, not a Rust-source scrape or
          Markdown table. The export carries locked methods, schema bindings,
          required actions, receipt flags, and Rust-computed schema
          fingerprints. The `_seam._wire` codec uses msgspec Raw/Struct
          envelopes, UNSET result/error handling, method-specific result
          decoding, batch routing by id, unknown-method rejection, null-id
          handling, and typed JSON-object coercion without public/wire `Any`.
          A follow-up slice added generated top-level msgspec payload/result
          records for Plan IR, Plan Result, and Stage Run, with nested operation
          and receipt bodies intentionally kept as msgspec Raw. This is still a
          foundation slice: full generated nested Plan IR and Plan Result schema
          branches remain before this row can be marked done.
    closeout_check: >-
      Handwritten Python schema mirrors, pydantic-only wire models, untyped
      dict payloads, response-order batch routing, or msgspec used as a
      transport/client abstraction cannot close this row.

  - id: python_sdk_project_quality_gate
    claim: >-
      The Python SDK is a real modular typed project with explicit dependency
      boundaries and production-ready public backbone surfaces.
    status: pending
    proof_required:
      kind: sdk_lint_type_package_contract
      must_exercise:
        - "`uv` project metadata, lockfile, package build/import, and `py.typed`"
        - public vs private module map and `__all__` discipline
        - public/runtime, optional, private/dev dependency declarations
        - "`msgspec` declared in the correct public/private dependency bucket for the generated wire codec layer"
        - no public `leaven/*` backbone method that only raises `NotImplementedError`
        - no `typing.Any` on public SDK APIs or public-seam wire boundaries
        - explicit JSON/value aliases or pydantic models instead of untyped dicts
        - Python 3.12+ native syntax; no `from __future__ import annotations`
        - Ruff enabled for maintainability families including ANN, ARG, C4, PIE, PL, PT, RET, TCH, TRY, PTH, PERF, and ANN401
        - "`uv run ty check ...`"
        - no checked-in non-generated Python file over 650 LOC
        - Python unit/example/law tests mirror source module paths outside `src`, with integration/scenario tests and shared fixtures split into explicit support locations
    evidence:
      - kind: focused_sdk_quality_foundation
        paths:
          - sdk/python/pyproject.toml
          - sdk/python/AGENTS.md
          - sdk/python/src/leaven/_seam/AGENTS.md
          - sdk/python/src/leaven/_seam/client.py
          - sdk/python/src/leaven/_seam/_wire/
          - sdk/python/tests/AGENTS.md
          - sdk/python/tests/_seam/_wire/
        commands:
          - cd sdk/python && uv lock
          - cd sdk/python && uv run pytest tests/test_stage_surface.py tests/_seam -q
          - cd sdk/python && uv run python -c "import leaven; print('import ok', 'SeamClient' not in dir(leaven))"
          - wc -l $(rg --files sdk/python/src sdk/python/tests sdk/python/codegen -g '*.py') | sort -nr | head -12
        note: >-
          msgspec is declared as a runtime dependency for the private generated
          seam wire codec, `_seam.client` now consumes that codec instead of
          raw JSON-RPC loads/dumps, test placement mirrors `_seam._wire`, and
          the checked-in Python file-count scan now shows the largest file at
          exactly 650 lines. The broader project-quality row remains pending
          until all public SDK/wire `Any` and public backbone scaffolds are
          audited and removed or explicitly kept private.
      - kind: sdk_quality_gate_lint_type_tests_package
        paths:
          - sdk/python/pyproject.toml
          - sdk/python/justfile
          - sdk/python/scripts/check_quality_contract.py
          - sdk/python/src/leaven/_seam_optimize/
          - sdk/python/src/leaven/_seam_worker/
          - sdk/python/src/leaven/_stage_runtime/
          - sdk/python/src/leaven/x/dspy/
          - sdk/python/examples/
          - sdk/python/tests/
        commands:
          - cd sdk/python && just check
          - cd sdk/python && uv run ruff check src/leaven examples tests --exclude src/leaven/_types
          - cd sdk/python && uv run ty check src/leaven tests --exclude src/leaven/_types
          - cd sdk/python && uv run pytest
          - cd sdk/python && just compile-examples
          - cd sdk/python && uv run python -c "import leaven; print('import ok', 'optimize' in dir(leaven), 'runs' in dir(leaven))"
          - cd sdk/python && uv run python codegen/generate_seam_wire.py --check
          - cd sdk/python && uv build
        note: >-
          The SDK quality gate now runs the custom line-count/future-annotation/
          mirrored-test/wire-Any checker, Ruff maintainability lint over
          hand-written source and examples, and ty over hand-written source
          successfully. The stricter documented checks over tests also pass:
          Ruff over source/examples/tests, ty over source/tests, all 55 pytest
          tests, example compilation, package import sanity, seam-wire codegen
          check, and wheel/sdist build. This slice also replaces several
          private scaffold `Any` annotations with `object` or local protocols
          and adds explicit test fixture/callback annotations. The row remains
          pending because public backbone scaffold removal/audit and all
          remaining public API `Any` decisions are not completed by lint success
          alone.
    closeout_check: >-
      Passing tests with broad Ruff ignores, untyped public/wire surfaces,
      future-annotation imports, or public backbone scaffolds cannot close this
      row.

  - id: live_codex_evolution_consumes_applied_artifact
    claim: >-
      After the retained public-seam method families are executable, a live
      Codex-backed agentic reflection/proposal loop evolves an AgentKit skill or
      system prompt and the next Codex stage consumes the applied child artifact.
    status: pending
    depends_on:
      - no_validated_only_locked_v1_methods
      - workspace_lifecycle_executes
      - effects_and_graph_writes_execute
      - rust_owned_run_readback_powers_python_inspection
      - python_wire_codegen_msgspec_boundary
      - python_sdk_project_quality_gate
    proof_required:
      kind: live_codex_agentic_evolution_e2e
      must_exercise:
        - live Codex run with `gpt-5.4-mini`
        - separate reflection and proposal stages, not one combined prompt
        - AgentKit system prompt or `.agents/skills` materialization
        - Codex-authored workspace mutation parsed into a typed proposal
        - "`leaven/proposal.submit_batch` through `leaven seam serve --stdio`"
        - "`leaven/proposal.apply` through `leaven seam serve --stdio`"
        - RunContext-owned child candidate creation and lineage
        - durable checkpoint/readback of the applied child artifact
        - a later live Codex stage that sees the evolved skill or system prompt
        - evaluation or assessment evidence showing seed-vs-child behavior
    evidence: []
    closeout_check: >-
      A live Codex prompt-consumption test, a deterministic AgentKit projection
      test, or `proposal.submit_batch` without application cannot close this
      row. The proof must show that Codex's change hit the next Codex stage
      through the same executable public-seam backbone that external-language
      SDK workers use.

  - id: examples_match_product_truth
    claim: Examples are classified and verified according to what they actually prove.
    status: pending
    proof_required:
      kind: examples_audit_and_run_matrix
      must_exercise:
        - examples README maturity table
        - all no-spend product examples
        - live-gated OpenAI and Codex examples when credentials are present
        - live Codex evolution example only after seam-backed method execution
        - shape-only scaffold examples renamed or labeled as non-product proof
    evidence: []
    closeout_check: A typechecked tour is not a runnable product example.

  - id: release_gate_for_public_contract
    claim: The public contract is verified with focused method tests plus the repo's broad gate.
    status: pending
    proof_required:
      kind: repo_gate
      must_exercise:
        - "`cargo test -p leaven --test topology_contract`"
        - public seam runtime/stdio/service tests
        - Python SDK tests and example matrix
        - Python wire codegen/msgspec codec tests
        - Python SDK Ruff/ty/package/import gates
        - "`just check`"
        - "`just coverage` or documented explicit user-approved deferral"
    evidence: []
    closeout_check: Broad gates cannot replace method-specific proof, and method-specific proof cannot replace public contract hygiene.

explicit_non_goals:
  - Upstream Agent Client Protocol conformance beyond the Leaven-owned profile.
  - Watch streaming semantics.
  - Provider credentials in default tests.
  - Compatibility shims for the previous foundation-only denominator.
  - Calling shape-only examples product-ready.
  - Preserving `human.review` in V1.

decision:
  status: set_goal
  reason: >-
    The prior foundation goal exposed an unacceptable mismatch: locked V1
    method contracts outpaced configured service execution and Python
    inspection still used a projection. This successor goal treats locked
    methods as external-language SDK backbone, removes mystery methods instead
    of preserving placeholders, and forbids closing on substrate smoke.
