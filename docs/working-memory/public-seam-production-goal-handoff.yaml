          row but does not close live-gated OpenAI/Codex example proof.
    closeout_check: A typechecked tour is not a runnable product example.

  - id: release_gate_for_public_contract
    claim: The public contract is verified with focused method tests plus the repo's broad gate.
    status: pending
    proof_required:
      kind: repo_gate
      must_exercise:
        - "`cargo test -p leaven --test topology_contract`"
        - public seam runtime/stdio/service tests
        - Python SDK tests and example matrix
        - Python wire codegen/msgspec codec tests
        - Python SDK Ruff/ty/package/import gates
        - "`just check`"
        - "`just coverage` or documented explicit user-approved deferral"
    evidence:
      - kind: build_loop_incremental_frontend_fix
        commits:
          - 80d72cef
        paths:
          - .cargo/config.toml
          - AGENTS.md
        commands:
          - RUSTFLAGS='' cargo test -p leaven-seam-service
          - cargo check -p leaven-public-seam -p leaven-seam-runtime -p leaven-seam-service -p leaven-acp -p leaven-acp-stage-bridge -p leaven-cli
          - cargo test -p leaven-seam-service service::tests::seam_runtime_services_agent_callback_from_command_worker -- --exact
          - cargo test -p leaven-seam-service
          - cargo test -p leaven-acp-stage-bridge
        note: >-
          Repeated default verification runs hit rustc 1.95.0-nightly
          incremental dep-graph ICEs while `-Zthreads=12` was injected by the
          repo Cargo config. The user explicitly rejected `CARGO_INCREMENTAL=0`,
          and root AGENTS says to remove the parallel frontend flag before
          disabling incremental when this regression appears. The config now
          leaves Cargo incremental enabled and no longer injects `-Zthreads`;
          the affected check/service/stage-bridge commands pass on the default
          path after the change. This is release-gate hygiene, not public-seam
          semantic closeout.
    closeout_check: Broad gates cannot replace method-specific proof, and method-specific proof cannot replace public contract hygiene.

explicit_non_goals:
  - Upstream Agent Client Protocol conformance beyond the Leaven-owned profile.
  - Watch streaming semantics.
  - Provider credentials in default tests.
  - Compatibility shims for the previous foundation-only denominator.
  - Calling shape-only examples product-ready.
  - Preserving `human.review` in V1.

decision:
  status: set_goal
  reason: >-
    The prior foundation goal exposed an unacceptable mismatch: locked V1
    method contracts outpaced configured service execution and Python
    inspection still used a projection. This successor goal treats locked
    methods as external-language SDK backbone, removes mystery methods instead
    of preserving placeholders, and forbids closing on substrate smoke.
