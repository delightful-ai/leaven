version: 1
artifact_kind: leaven_goal_handoff
status: set_goal
created: 2026-06-03

goal:
  slug: public_seam_v1_production_denominator
  original_intent:
    user_question: >-
      Make Leaven's public seam and Python SDK real enough that locked V1
      backbone protocol methods execute for external-language SDK workers,
      rather than validating a convincing substrate smoke.
    user_should_be_able_to:
      - >-
        Use every locked backbone `leaven/*` method advertised by the V1 worker
        profile through `leaven seam serve --stdio`, or see the method explicitly
        removed from the locked V1 profile before closeout.
      - >-
        Inspect completed Python SDK runs from Rust-owned durable run/checkpoint
        state, not only an SDK-written projection file.
      - >-
        Use a real Python SDK project whose public surface is modular,
        fully typed, Python 3.12+ native, and dependency-explicit, with public
        and private modules/dependencies clearly separated.
      - >-
        Use Python wire types/codecs generated from Rust-owned public-seam
        truth. Python decodes and shape-checks JSON-RPC at the boundary with
        typed msgspec records, while Rust remains the authority for method
        semantics, capability, receipts, and graph mutation.
      - >-
        Run examples whose README labels match behavior: product examples run
        end to end, while shape-only scaffolds are clearly not product proofs.
      - >-
        Prove a live Codex evolution loop only after the retained public-seam
        backbone methods execute: one Codex-authored reflection/proposal
        changes an AgentKit skill or system prompt, Leaven materializes and
        applies the resulting candidate through the seam, and a later Codex
        stage consumes the evolved artifact rather than the seed.

spec_package:
  package_name: public_seam_v1_production_denominator
  governing_docs:
    - path: docs/specs/leaven_python.md
      role: Python SDK product surface and user-facing authoring contract.
    - path: docs/specs/public-seam-v1/
      role: Locked public seam schemas, worker profile, method families, and V1 scope.
    - path: docs/specs/public-seam-v1/executable-method-status.md
      role: Current method execution truth; must reach zero validated-only locked V1 methods.
    - path: docs/working-memory/public-seam-sdk-goal-handoff.yaml
      role: Historical foundation proof and evidence ledger, not sufficient closeout for this goal.
    - path: sdk/python/codegen/README.md
      role: Current Python schema/codegen staging notes; must be updated or superseded by Rust-owned msgspec codegen.
    - path: AGENTS.md
      role: Hard cutover, topology, maturity, and verification contract.

designed_surface:
  public_surface:
    - name: locked_v1_method_table
      user_interaction: >-
        The methods advertised by the locked worker profile are executable
        SDK/worker backbone promises, not placeholders and not end-user product
        features. A method that is not executable must be removed from V1 before
        completion.
    - name: leaven_seam_stdio_service
      user_interaction: >-
        `leaven seam serve --stdio` executes the locked method table through
        configured services with real run/workspace/case state, receipts,
        errors, and capability enforcement.
    - name: python_sdk_run_inspection
      user_interaction: >-
        `lv.runs.open(...)` and `lv.runs.inspect(...)` read durable
        Rust-owned run/checkpoint state or a documented Rust-owned exported
        artifact, not a Python-only shadow projection.
    - name: python_sdk_project_quality
      user_interaction: >-
        The Python SDK remains a proper `uv` package with `py.typed`, clear
        public/private modules, declared public/private dependencies, strict
        Ruff/ty gates, no public backbone scaffolds, no `Any` on public or
        wire-boundary surfaces, and no checked-in Python file over 650 LOC.
    - name: python_wire_codec_contract
      user_interaction: >-
        Python wire records and JSON-RPC codecs are generated from Rust-owned
        public-seam schema/method truth and implemented with msgspec at the
        boundary. The codec parses request/response envelopes, preserves
        missing-vs-null where JSON-RPC requires it, decodes method-specific
        payloads/results into generated types, and leaves transport, retries,
        auth, batching, and service semantics outside the codec.
    - name: examples_contract
      user_interaction: >-
        Example labels match reality: behavior-bearing examples run, live
        examples are gated, and any shape-only files are named as scaffolds.
    - name: codex_evolution_contract
      user_interaction: >-
        A live Codex-backed agentic reflection/proposal loop evolves a real
        AgentKit skill or system prompt, routes materialization/readback and
        proposal application through the executable public seam, and proves the
        evolved artifact affects the next Codex stage.
  private_machinery_relevant_to_handoff:
    - RunContext remains the graph mutation authority; proposal apply,
      assessment submit, evaluation request, and event emission must not bypass it.
    - Case/graph reads must come from the run/case substrate under explicit
      read scope, not hardcoded worker payloads.
    - Workspace methods must be owned by workspace backends and scoped handles.
    - Blob refs without byte retrieval are not sufficient for inspection closeout.
    - Python may decode and shape-check seam JSON, but it must not duplicate
      Rust's authority for method semantics, capability policy, receipt truth,
      or graph mutation.

intent_preservation:
  verdict: preserved
  reason: >-
    This successor goal preserves the corrected intent only if the locked V1
    contract and configured service reality converge. Passing the previous
    foundation live proofs is useful evidence, but not completion.

misleading_proxy_proofs:
  - proxy: "The previous public-seam SDK handoff is all `done`."
    why_insufficient: It closed a foundation denominator that explicitly left method-family and checkpoint gaps.
    forbidden_as_completion_evidence: true
  - proxy: "Runtime dispatch validates every locked method envelope."
    why_insufficient: Validation-only methods still fail at the configured service boundary.
    forbidden_as_completion_evidence: true
  - proxy: "`executable-method-status.md` documents unsupported methods honestly."
    why_insufficient: Honest docs prevent lying but do not make locked V1 production-ready.
    forbidden_as_completion_evidence: true
  - proxy: "Python inspection reads `.leaven/runs/<run_id>/optimized.json`."
    why_insufficient: That is a Python SDK projection, not proven Rust graph/checkpoint readback.
    forbidden_as_completion_evidence: true
  - proxy: "The Python SDK has `pyproject.toml`, `uv.lock`, and `py.typed`."
    why_insufficient: >-
      Project shape is necessary but not enough. The public SDK must be
      modular, fully typed, dependency-explicit, Python 3.12+ native, and free
      of public/wire-boundary `Any` or public backbone `NotImplementedError`
      gaps before closeout.
    forbidden_as_completion_evidence: true
  - proxy: "Python hand-written pydantic models mirror the public-seam schemas."
    why_insufficient: >-
      A hand mirror can drift from the Rust-owned wire contract. The SDK needs
      generated msgspec wire records/codecs from Rust-owned public-seam truth,
      with handwritten Python reserved for ergonomic SDK wrappers and transport.
    forbidden_as_completion_evidence: true
  - proxy: "Live OpenAI or Codex examples still pass."
    why_insufficient: They exercise a subset of method families and do not prove the locked V1 denominator.
    forbidden_as_completion_evidence: true
  - proxy: "Codex consumed a projected prompt or skill once."
    why_insufficient: >-
      One live agent session proves provider consumption only. It does not prove
      agentic reflection, typed proposal readback, RunContext-owned proposal
      application, or that the changed artifact is what the next Codex stage saw.
    forbidden_as_completion_evidence: true
  - proxy: "`leaven seam serve --stdio` mutates the configured `SeamTextProblem` proof graph."
    why_insufficient: >-
      The configured RunContext service proves locked method names can cross the
      CLI/runtime/service boundary into engine mutation. It does not prove a
      generalized SDK worker service bound to a real optimizer run, real
      problem-specific lowering, durable run/checkpoint stores, or checkpoint
      readback of the mutated run.
    forbidden_as_completion_evidence: true

spec_revisions_before_goal:
  - update: >-
      Decide method-by-method whether each locked V1 method is a true
      external-language worker backbone method. Implement the true backbone
      methods now and remove non-backbone methods from the locked V1 profile.
      Do not leave validated-only methods in V1.
    rationale: The public contract must not advertise non-executable methods.
    status: done
  - update: >-
      Remove `leaven/human.review` from the locked V1 profile, schemas,
      capability examples, method-status docs, and tests. It is not part of the
      intended external-language SDK backbone.
    rationale: Avoid implementing a mystery method just because it was locked too early.
    status: done
  - update: >-
      Update example maturity labels so product-proof examples and shape-only
      scaffolds are not mixed under "runnable examples" language.
    rationale: Example labels are part of public maturity truth.
    status: pending
  - update: >-
      Replace or supersede the current Python `_types` staging path with a
      Rust-owned public-seam schema/method export that generates msgspec wire
      records and JSON-RPC codecs for Python.
    rationale: External-language SDKs need typed generated wire truth, not hand-maintained mirrors.
    status: pending

acceptance:
  - id: human_review_removed_from_v1
    claim: "`leaven/human.review` is removed from the active codebase and is no longer advertised or accepted as a locked V1 method."
    status: done
    proof_required:
      kind: profile_schema_docs_tests
      must_exercise:
        - active Rust production code
        - active Rust/Python tests and fixtures
        - active public seam schemas
        - locked extension method table
        - ACP/profile fixture docs
        - capability examples and tests
        - method-status docs
        - negative request proof through `leaven seam serve --stdio`
    evidence:
      - kind: code_schema_docs
        paths:
          - crates/leaven-public-seam/src/acp_profile/methods.rs
          - crates/leaven-public-seam/src/acp_profile/extension_result.rs
          - crates/leaven-public-seam/src/call_authority.rs
          - docs/specs/public-seam-v1/schemas/leaven.plan.v1.schema.json
          - docs/specs/public-seam-v1/schemas/leaven.plan_result.v1.schema.json
          - docs/specs/public-seam-v1/schemas/leaven.capability.v1.schema.json
          - docs/specs/public-seam-v1/schemas/common.schema.json
          - docs/specs/public-seam-v1/profiles/leaven_acp_profile_v1_v0.3.md
          - docs/specs/public-seam-v1/executable-method-status.md
          - crates/leaven-public-seam/src/capability.rs
          - crates/leaven-public-seam/src/capability/budget.rs
          - crates/leaven-public-seam/src/capability/delegation.rs
        note: Locked V1 method/profile rows, Plan IR call shape, result receipt kind, data class, budget axis, and active docs no longer advertise or accept human review. The old human-specific budget field was hard-cut to evaluator budget vocabulary.
      - kind: negative_stdio_request
        command: cargo test -p leaven-cli --test seam_stdio_server
        note: Process-level `leaven seam serve --stdio` proof sends `leaven/human.review` and receives JSON-RPC method-not-found before service execution.
      - kind: active_inventory
        command: rg -n 'human_review_usd_micro|human_review_result|human_review_calls|human_review"|human\.review|HumanReviewCall|max_human_usd_micro|human_usd_micro|human\.usd_micro|human-review|human review' --glob '!target/**' --glob '!sdk/python/.venv/**' --glob '!docs/working-memory/public-seam-production-goal-handoff.yaml'
        note: Only remaining non-archival active-tree match is the intentional negative stdio request in `crates/leaven-cli/tests/seam_stdio_server.rs`; remaining prose hits are archival review/provenance files outside the active public contract.
      - kind: verification
        commands:
          - cargo fmt --check
          - cargo test -p leaven-public-seam --test public_seam_contract
          - cargo test -p leaven-cli --test seam_stdio_server
          - cargo test -p leaven-acp --test stdio_session_contract
          - cargo test -p leaven-acp-stage-bridge --test dispatch_contract
          - cargo test -p leaven-acp-stage-bridge --test example_03_prompt_optimize
          - cargo test -p leaven --test topology_contract
    closeout_check: >-
      No active production code, schema enum, V1 method table, docs, generated
      fixture, or test may still treat `human.review` as supported. Any
      remaining string match must be archival review/provenance text or the
      explicit removal note for this goal.

