  - id: live_codex_evolution_consumes_applied_artifact
    claim: >-
      After the retained public-seam method families are executable, a live
      Codex-backed agentic reflection/proposal loop evolves an AgentKit skill or
      system prompt and the next Codex stage consumes the applied child artifact.
    status: pending
    depends_on:
      - no_validated_only_locked_v1_methods
      - workspace_lifecycle_executes
      - effects_and_graph_writes_execute
      - rust_owned_run_readback_powers_python_inspection
      - python_wire_codegen_msgspec_boundary
      - python_sdk_project_quality_gate
    proof_required:
      kind: live_codex_agentic_evolution_e2e
      must_exercise:
        - live Codex run with `gpt-5.4-mini`
        - separate reflection and proposal stages, not one combined prompt
        - AgentKit system prompt or `.agents/skills` materialization
        - Codex-authored workspace mutation parsed into a typed proposal
        - "`leaven/proposal.submit_batch` through `leaven seam serve --stdio`"
        - "`leaven/proposal.apply` through `leaven seam serve --stdio`"
        - RunContext-owned child candidate creation and lineage
        - durable checkpoint/readback of the applied child artifact
        - a later live Codex stage that sees the evolved skill or system prompt
        - evaluation or assessment evidence showing seed-vs-child behavior
    evidence: []
    closeout_check: >-
      A live Codex prompt-consumption test, a deterministic AgentKit projection
      test, or `proposal.submit_batch` without application cannot close this
      row. The proof must show that Codex's change hit the next Codex stage
      through the same executable public-seam backbone that external-language
      SDK workers use.

