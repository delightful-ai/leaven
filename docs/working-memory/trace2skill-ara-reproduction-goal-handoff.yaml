version: 1
artifact_kind: leaven_goal_handoff
status: set_goal

goal:
  slug: trace2skill_ara_1_to_1_reproduction
  original_intent:
    user_question: >-
      Reproduce the Trace2Skill / SpreadsheetBench agent-harness optimization
      paper 1:1, using an ARA as the denominator, while avoiding historical
      false pretenses where paper-shaped YAMLs, demos, one-case proofs, or
      mechanics tests were treated as reproduction.
    user_should_be_able_to:
      - >-
        Inspect a Trace2Skill ARA that faithfully captures exact paper claims,
        tables, figures, configs, prompts, source-code anchors, and evidence
        limits.
      - >-
        Regenerate paper target plots from ARA evidence and overlay Leaven
        results without mixing target data and reproduced data.
      - >-
        Run the Trace2Skill SpreadsheetBench path through Leaven-owned
        surfaces and know exactly which denominator was proven: one-case,
        subset, held-out split, seed aggregate, cross-model, or full paper.
      - >-
        Read closeout language that refuses to call proxy artifacts a 1:1
        reproduction.

spec_package:
  package_name: trace2skill_ara_reproduction
  governing_docs:
    - path: docs/specs/initial_library.md
      role: Overall optimizer/evidence/run architecture.
    - path: docs/specs/guiding_principles.md
      role: Artifact-neutral optimization and audit/evidence principles.
    - path: docs/specs/leaven_python.md
      role: Python product surface and paper live-run versus bring-up boundary.
    - path: docs/testing/README.md
      role: Verification contract and suite expectations.
    - path: docs/plans/2026-06-14-trace2skill-ara-reproduction.md
      role: Execution plan for ARA compilation, plotting, and reproduction gates.
  source_denominator:
    - path: tmp/skill_opt_sources/arx_2603.25158/full_source.md
      role: Extracted Trace2Skill paper text and result tables.
    - path: tmp/repros/trace2skill-upstream
      role: Local upstream Trace2Skill repository checkout.
    - path: /Users/darin/vendor/github.com/Qwen-Applications/Trace2Skill
      role: Vendor upstream Trace2Skill checkout.
    - path: docs/working-memory/trace2skill-replication.md
      role: Current Leaven dossier for source anchors and progress.
    - path: docs/working-memory/skill-paper-replication.md
      role: Cross-paper maturity summary and false-claim warnings.
    - path: examples/trace2skill_spreadsheetbench
      role: Current SpreadsheetBench mechanics-smoke crate.
    - path: examples/trace2skill_tiny_live
      role: Tiny live proxy lane that must not be mistaken for paper parity.

designed_surface:
  public_or_operator_surface:
    - name: Trace2Skill ARA
      user_interaction: >-
        Read `docs/ara/trace2skill_spreadsheetbench/PAPER.md` and drill into
        claims, evidence, configs, algorithm, exploration graph, and validation
        outputs.
    - name: ARA-driven plots
      user_interaction: >-
        Run a plotting command that reads ARA evidence tables and draws paper
        targets plus optional Leaven-result overlays.
    - name: trace2skill_spreadsheetbench
      user_interaction: >-
        Run focused commands for manifest lowering, upstream artifact import,
        patch replay, exact one-case scoring, external-worker mechanics, and
        later live/subset/full-denominator runs.
    - name: result denominator report
      user_interaction: >-
        Every generated result states whether it is mechanics, one-case,
        subset, held-out split, seed aggregate, cross-model, or full paper.
  private_machinery_relevant_to_handoff:
    - ARA compiler schema owns the cognitive/evidence/config/trace package.
    - >-
      `leaven-agentic-skill` owns paper-neutral patch plan, merge tree, and
      application primitives.
    - >-
      `examples/trace2skill_spreadsheetbench` owns Trace2Skill-specific
      SpreadsheetBench lowering and replay glue.
    - >-
      `examples/trace2skill_tiny_live` remains a proxy causal proof, not a
      paper-denominator proof.

intent_preservation:
  verdict: preserved
  reason: >-
    The designed surface preserves the original request only if completion
    requires a validated ARA, paper target plots sourced from that ARA, and
    Leaven result overlays whose proof denominator is explicit. It does not
    preserve intent if it stops at YAML neatness, one-case proof, tiny proxy
    live loops, or existing mechanics tests.

misleading_proxy_proofs:
  - proxy: A historical YAML or new ARA-looking file exists.
    why_insufficient: Structure alone does not transcribe exact paper evidence or validate claim/evidence bindings.
    forbidden_as_completion_evidence: true
  - proxy: The paper target plots render.
    why_insufficient: They are target lines copied from the paper, not Leaven reproduced results.
    forbidden_as_completion_evidence: true
  - proxy: "`examples/trace2skill_tiny_live` passes."
    why_insufficient: It uses a tiny CSV task and Codex/GPT-5.4-mini instead of SpreadsheetBench/Qwen/vLLM.
    forbidden_as_completion_evidence: true
  - proxy: "The `13-1` one-case scorer or external worker passes."
    why_insufficient: It proves one-case mechanics, not the `200..400` held-out split or seed aggregation.
    forbidden_as_completion_evidence: true
  - proxy: Manifest, patch bridge, or patch replay tests pass.
    why_insufficient: They prove no-spend lowering/replay mechanics, not live trajectory generation, analyst calls, merge calls, or paper metrics.
    forbidden_as_completion_evidence: true
  - proxy: A Harbor or other container task runs.
    why_insufficient: Trace2Skill's paper denominator is SpreadsheetBench with its released code/model/split protocol unless explicitly scoped as a separate adapter experiment.
    forbidden_as_completion_evidence: true
  - proxy: Subset results improve.
    why_insufficient: Subset evidence may unblock the next gate but cannot be labeled full 1:1 reproduction.
    forbidden_as_completion_evidence: true

spec_revisions_before_goal: []

acceptance:
  - id: ara_level1_valid
    claim: >-
      `docs/ara/trace2skill_spreadsheetbench` is a complete ARA with exact
      Trace2Skill claims, concepts, experiments, algorithm/config/environment,
      exploration graph, and evidence tables/figures.
    status: pending
    proof_required:
      kind: validator_and_manual_evidence_audit
      must_exercise:
        - ARA mandatory files
        - exact result-table transcription
        - claim to experiment to evidence binding
        - explicit unsupported or not-specified fields
    evidence: []
    closeout_check: A file tree without evidence fidelity is not enough.

  - id: plots_from_ara
    claim: Paper target plots regenerate from ARA evidence and can overlay Leaven results separately.
    status: pending
    proof_required:
      kind: script_output
      must_exercise:
        - baseline versus evolved skill target plot
        - parallel versus sequential runtime/score target plot
        - Trace2Skill versus ReasoningBank target plot
        - no hard-coded scratch-only plot data
        - separate paper-target and Leaven-result legends
    evidence: []
    closeout_check: Target plots alone are not reproduction evidence.

  - id: current_mechanics_classified
    claim: Existing Trace2Skill Leaven tests are bound to ARA claims with honest proof classifications.
    status: pending
    proof_required:
      kind: focused_tests_and_ara_mapping
      must_exercise:
        - manifest
        - run_artifacts
        - patch_bridge
        - patch_replay
        - one_case and cli
        - workbook_score
        - acp_external_worker
    evidence: []
    closeout_check: Passing mechanics tests cannot be promoted to paper parity.

  - id: one_case_live_or_explicit_blocker
    claim: >-
      The exact SpreadsheetBench case `13-1` can be run, scored, and recorded
      through the intended seam, or the missing live spreadsheet-agent primitive
      is named with exact blocker evidence.
    status: pending
    proof_required:
      kind: live_or_blocked_run_artifacts
      must_exercise:
        - prepared one-case run directory
        - output workbook requirement
        - transcript/result envelope
        - score_report and trajectory evidence
    evidence: []
    closeout_check: A valid envelope without workbook output remains failure.

  - id: full_denominator_plan_approved
    claim: >-
      The full paper-denominator run plan records Qwen/vLLM model requirements,
      split protocol, seeds, workers, merge batch size, turn budget, cost,
      hardware, and approval gates before live scale execution.
    status: pending
    proof_required:
      kind: approved_compute_plan
      must_exercise:
        - Qwen3.5-122B-A10B
        - Qwen3.5-35B-A3B
        - seeds 41, 42, 43
        - SpreadsheetBench rows 0..200 and 200..400
        - workers 128
        - merge batch size 32
        - ReAct turn budget 100
        - cost and hardware disclosure
    evidence: []
    closeout_check: Do not launch or claim full reproduction without this approval.

  - id: reproduced_claim_limited_to_actual_denominator
    claim: >-
      Final closeout states exactly what was reproduced and does not claim 1:1
      reproduction unless the full paper denominator has been run and compared.
    status: pending
    proof_required:
      kind: closeout_audit
      must_exercise:
        - ARA rigor review
        - denominator report
        - paper target versus Leaven result overlays
        - explicit non-goals and blockers
    evidence: []
    closeout_check: Closeout must compare final work to this handoff artifact.

explicit_non_goals:
  - Claiming full Trace2Skill reproduction from YAML, ARA structure, or paper-target plots alone.
  - Treating the CSV tiny live loop as SpreadsheetBench parity.
  - Treating one-case `13-1` proof as held-out split or seed-aggregate proof.
  - Running large Qwen/vLLM jobs without explicit cost/hardware approval.
  - Converting the paper target into a Harbor benchmark unless scoped as a separate adapter experiment.
  - Hiding live/model/provider failures behind mechanics-smoke success.

decision:
  status: set_goal
  reason: >-
    The user explicitly asked to set the goal, the intent is clear, and this
    handoff preserves the 1:1 reproduction denominator while forbidding the
    historical false-success artifacts.
