version: 1
artifact_kind: leaven_goal_handoff
status: draft_for_alignment
created: 2026-06-02

goal:
  slug: public_seam_powers_python_sdk
  original_intent:
    user_question: >-
      Make Codex/agentic Leaven first-class by making the Leaven public seam the
      real durable API substrate for SDKs and agent runtimes, not a demo bridge,
      not an ACP-shaped naming accident, and not a single callback proof.
    user_should_be_able_to:
      - >-
        Write and run a Leaven optimization from Python through `lv.optimize(...)`
        using the public SDK shape in `docs/specs/leaven_python.md`.
      - >-
        Have Python-authored stages execute as external-language workers over the
        Leaven seam while the Rust engine keeps optimizer loop, graph mutation,
        receipts, budgets, capabilities, and trust enforcement.
      - >-
        Configure runtime providers from Python: deterministic/mock providers
        for no-spend mechanics tests, real LM providers for live acceptance
        evidence, and Codex agent runtime using `gpt-5.4-mini` for
        materialized-workspace proposer/reflector stages.
      - >-
        Inspect a completed run with lineage, receipts, evidence, and optimizer
        result intact instead of trusting stdout or a hardcoded demo success.

spec_package:
  package_name: public_seam_python_sdk_runtime
  governing_docs:
    - path: docs/specs/leaven_python.md
      role: Governing product spec; Python is the product-facing Leaven surface.
    - path: docs/specs/public-seam-v1/
      role: >-
        Locked Leaven public seam: Plan IR, stage dispatch, capabilities,
        receipts, schemas, and method families.
    - path: docs/specs/public-seam-v1/profiles/leaven_acp_profile_v1_v0.3.md
      role: Leaven-owned worker profile; filename still says acp as a legacy identifier.
    - path: docs/specs/public-seam-v1/conformance-matrix.yaml
      role: Row-level proof denominator for seam obligations.
    - path: sdk/python/
      role: >-
        Current real in-repo Python SDK project: importable package, dependency
        declaration, examples, tests, codegen, and private seam client modules.
    - path: docs/specs/leaven_py/
      role: Vendored Python SDK research/provenance only; not the runtime package.
    - path: AGENTS.md
      role: Repo topology, hard-cutover, public-maturity, and verification contract.
  current_state_notes:
    - >-
      `leaven-public-seam` already owns schema validation, method/profile docs,
      Plan IR execution helpers, typed LM/agent lowering, and stage-run validators.
    - >-
      `leaven-seam-runtime` and `leaven-seam-stdio` expose a transport-neutral
      JSON-RPC stdio shell. The CLI path now executes configured service
      families for `lm.complete`, `agent.run` with workspace materialization,
      deterministic runner `stage.run`, and command-backed runner `stage.run`
      through an explicitly configured subprocess worker. Python
      `lv.optimize(...).run()` now uses a checked-in private worker package for
      registered runner-stage dispatch in the prompt mechanics slice, and that
      worker can call back to configured `leaven/lm.complete` while a stage is
      running and can call back to configured `leaven/agent.run` for
      materialized-workspace agent execution.
    - >-
      `leaven serve --stdio --plan --out` is a legacy bidirectional GEPA demo
      path; it is not the durable public SDK server.
    - >-
      A mock prompt-optimization example is useful smoke evidence, but it is not
      completion evidence for the SDK or Codex agentic runtime.
    - >-
      User approved live proof spend on 2026-06-02 with a total ceiling of
      5 USD. Native Codex auth is expected to work; direct
      `codex exec --model gpt-5.4-mini ...` is only an auth/model smoke or
      adapter-level diagnostic. The acceptance proof must run through Leaven
      end-to-end.
    - >-
      The goal is the latest Python-plan foundation slice: build the durable
      public-seam SDK substrate and prove it works end-to-end. It is not a claim
      that every future provider, method family, paper workflow, or production
      hardening task is finished.

designed_surface:
  public_surface:
    - name: python_sdk_product_surface
      user_interaction: >-
        `lv.Task`, `lv.Rollout`, `lv.Rubric`, `lv.optimizers.gepa(...)`,
        `lv.runtime.local(...)`, and `lv.optimize(...).run()` compose the whole
        run from Python.
    - name: leaven_public_seam_server
      user_interaction: >-
        A stable `leaven seam serve --stdio` JSON-RPC server executes the locked
        `leaven/*` request/response families through configured runtime services.
    - name: stage_worker_callbacks
      user_interaction: >-
        Python stage functions run through `leaven/stage.run`; stage code can call
        `cx.case`, `cx.workspace`, `cx.lm`, `cx.agent`, `cx.sandbox`,
        `cx.proposals`, `cx.assessments`, and `cx.batch()` through the same seam.
    - name: codex_agent_runtime
      user_interaction: >-
        A proposer/reflector can materialize a workspace, run Codex against it,
        parse typed output, and submit proposals with receipts and lineage.
    - name: provider_config
      user_interaction: >-
        Python can choose deterministic/mock providers for mechanics tests and
        configure real LM/Codex providers for live acceptance runs without
        changing the public stage code.
  private_machinery_relevant_to_handoff:
    - Rust keeps optimizer loops, RunContext graph mutation, capability minting, receipt validation, budgets, and provider adapters.
    - Python authors stage behavior and run composition, not optimizer strategy state or graph mutation internals.
    - The public seam is Leaven-owned JSON-RPC, not upstream ACP conformance; ACP naming must not become product truth.
    - Live-provider-backed `lm.complete`, live Codex `agent.run`, workspace materialization, stage dispatch, and proposal/assessment writes are all required to prove the SDK path.

live_proof_budget:
  status: approved
  approved_at: 2026-06-02
  total_usd_ceiling: 5
  codex_model: gpt-5.4-mini
  codex_auth_route: native_codex_cli_auth
  codex_smoke_command_shape: "codex exec --model gpt-5.4-mini ..."
  rules:
    - Spend-bearing live proof must stay inside the 5 USD total ceiling.
    - Deterministic/mock tests remain mechanics evidence only.
    - Direct `codex exec` can prove native auth/model reachability, not Leaven integration.
    - Codex acceptance evidence must flow through Python SDK -> Leaven public seam -> `leaven/agent.run` -> materialized workspace.
    - Missing auth or a broken native Codex CLI path is a blocker, not a substitute proof.
    - Default tests still must not require credentials or spend.

intent_preservation:
  verdict: preserved_if_acceptance_denominator_holds
  reason: >-
    The designed surface preserves the user's actual intent only if the Python
    SDK drives a real optimization through the Leaven seam with externally
    executed Python stages and provider-backed effects. A single method, schema
    validator, hardcoded Rust proposer, or mock-only prompt toy is progress, not
    the thing the user asked to make true.
  what_the_user_would_bristle_at:
    - "`leaven/lm.complete` returns over stdio, therefore the SDK works."
    - "`leaven seam serve --stdio` accepts JSON-RPC but rejects real providers."
    - "The Rust harness improves a prompt, so Python/Codex agentic Leaven is real."
    - "ACP naming or legacy bridge mechanics become the explanation instead of Leaven's own seam."
    - "Examples compile while real SDK users still cannot configure runtime, stages, agents, and inspection from Python."

misleading_proxy_proofs:
  - proxy: "A single `leaven/lm.complete` JSON-RPC request succeeds."
    why_insufficient: It proves one callback path, not stage dispatch, optimizer execution, proposal writes, receipts, or SDK composition.
    forbidden_as_completion_evidence: true
  - proxy: "`leaven seam serve --stdio` validates method envelopes but returns method-unavailable for real work."
    why_insufficient: Validation-only stdio is scaffolding; the public server must execute configured services.
    forbidden_as_completion_evidence: true
  - proxy: "Legacy `leaven serve --stdio --plan --out` optimizes a prompt."
    why_insufficient: It is the old bridge demo, not the durable public seam server that SDKs spawn.
    forbidden_as_completion_evidence: true
  - proxy: "Rust hardcodes the reflector/proposer or prompt rewrite."
    why_insufficient: The Codex/agentic value is Python-configured stage behavior and Codex operating in materialized workspaces.
    forbidden_as_completion_evidence: true
  - proxy: "Mock-only example 03 reaches best score 1.0."
    why_insufficient: Useful smoke; does not prove real provider wiring, Codex agent runtime, reward vectors, or inspection.
    forbidden_as_completion_evidence: true
  - proxy: "All request/response types and validators are public."
    why_insufficient: Schema exposure matters, but SDK users need an executable seam server and runtime configuration.
    forbidden_as_completion_evidence: true
  - proxy: "Broad `just check` passes."
    why_insufficient: Repo hygiene does not prove the product-facing SDK path works.
    forbidden_as_completion_evidence: true

spec_revisions_before_goal:
  - update: >-
      Clean current docs and AGENTS references so ACP is described only as legacy
      naming or an optional future agent-runtime interop boundary; the product
      seam is Leaven's own JSON-RPC public seam.
    rationale: Avoid future agents treating ACP as the thing powering the SDK.
    status: pending
  - update: >-
      Clarify `leaven seam serve --stdio` as the durable public server route and
      classify legacy `leaven serve --stdio --plan --out` as bridge-demo/provenance.
    rationale: Prevent completion claims from using the old demo path.
    status: done
  - update: >-
      Record which `leaven/*` methods are executable, configured-provider-backed,
      mock-only, or intentionally unsupported in V1.
    rationale: Make partial seam execution honest without undercutting the API.
    status: done

acceptance:
  - id: docs_and_route_truth
    claim: Docs and ownership files say the public seam is Leaven's SDK substrate, with ACP named only as legacy/provenance or future agent interop.
    status: pending
    proof_required:
      kind: docs_review
      must_exercise:
        - docs/specs/leaven_python.md
        - docs/specs/public-seam-v1/README.md
        - docs/specs/public-seam-v1/profiles/leaven_acp_profile_v1_v0.3.md
        - AGENTS.md and nearest crate AGENTS files touched by the route
    evidence:
      - >-
        Route/method-status evidence: `docs/specs/public-seam-v1/README.md`
        now names `leaven seam serve --stdio` as the active SDK server route
        and classifies legacy `leaven serve --stdio --plan --out` as
        bridge-demo/provenance only. `docs/specs/public-seam-v1/executable-method-status.md`
        records which locked `leaven/*` families are mock-configured,
        configured-local, live-provider-configured, validated-only, or
        unsupported by the current configured service. The worker profile points
        readers to that denominator, and `crates/leaven-seam-service/AGENTS.md`
        requires updating it when service behavior changes.
      - >-
        Partial SDK evidence, not acceptance completion: Python
        `lv.optimize(...).run()` now executes every configured `Rubric` reward
        after durable-seam runner stage dispatch, preserves per-axis
        `RewardAssessment` rows, and reduces the vector with configured
        weights into the candidate `Score`. `uv run pytest
        tests/test_stage_surface.py -q` covers two registered rewards returning
        both bare floats and `RewardValue` feedback. `LEAVEN_BIN=...
        uv run python examples/03_prompt_optimize.py` proves the real SDK
        optimize path through `leaven seam serve --stdio` returns printed
        reward-vector rows from `result.assessments()`. This still does not
        prove Rust optimizer admission semantics for vector rewards,
        proposal-generating GEPA search, or persisted run readback.
    closeout_check: No closeout may explain the SDK as "ACP" rather than the Leaven public seam.

  - id: public_seam_server_executes
    claim: >-
      `leaven seam serve --stdio` executes configured Leaven method families
      instead of rejecting them by default.
    status: pending
    proof_required:
      kind: focused_stdio_jsonrpc_tests
      must_exercise:
        - request envelope validation
        - Plan IR execution through `PublicSeamPackage::execute_plan_document*`
        - typed runtime config loaded by the CLI
        - honest unsupported-provider errors for unconfigured methods
        - no use of legacy `leaven serve --stdio --plan --out`
    evidence:
      - >-
        Partial mechanics evidence, not acceptance completion: current
        configured-stage slice makes `leaven-seam-service` execute runner
        `leaven/stage.run` through a configured deterministic `mock_runner`.
        `cargo test -p leaven-seam-service` covers valid configured stage-run
        results and explicit unconfigured-runner failure; a Python one-off proof
        sent `StageRunRequest` through `SeamClient` to `leaven seam serve
        --stdio --config` and received `stage_run_result` for `sc_stage_proof`.
        This does not prove Python-authored worker stage execution.
      - >-
        Partial worker-dispatch evidence, not acceptance completion:
        `leaven-seam-service/src/stage.rs` now owns `CommandRunner`
        subprocess dispatch for runner `leaven/stage.run`. `cargo test -p
        leaven-seam-service` proves the service writes a locked stage-run
        JSON-RPC request to a child process and returns the child result through
        runtime validation; a Python one-off proof serialized
        `CommandRunnerStageConfig`, spawned `leaven seam serve --stdio
        --config`, and received `stage_run_result` from a separate Python
        worker process for `sc_python_worker_proof`. This still does not prove
        registered SDK stages, role-scoped `cx`, callbacks from inside the
        worker, GEPA search, or inspection.
    closeout_check: Validation-only or rejecting-service paths remain scaffolding, not completion.

  - id: python_sdk_drives_public_server
    claim: >-
      Python `lv.optimize(...).run()` spawns/configures the durable public seam
      server and drives a real optimization through it.
    status: pending
    proof_required:
      kind: python_example_or_integration_test
      must_exercise:
        - sdk/python package surface
        - runtime config from Python into the spawned server
        - stage dispatch over `leaven/stage.run`
        - stage callbacks over `leaven/*` effect methods
        - run result object with evidence/receipt surface, not stdout-only success
    evidence:
      - >-
        Partial mechanics evidence, not acceptance completion: Python private
        seam config now serializes `MockRunnerStageConfig`,
        `CommandRunnerStageConfig`, and private `StageRunRequest` constructs
        the locked runner `leaven/stage.run` envelope. This proves Python can
        configure and call the durable server for deterministic and subprocess
        stage-run mechanics, not that registered SDK stages and callbacks are
        wired into `lv.optimize(...).run()`.
      - >-
        Partial mechanics evidence, not acceptance completion: current optimize
        hard-cut slice routes `OptimizeBuilder.run` through
        `leaven._seam_optimize`, which uses `SeamClient` and
        `StageRunRequest` against `leaven seam serve --stdio --config`.
        `uv run python examples/03_prompt_optimize.py` now invokes
        `lv.optimize(...).run()` through that durable route and returns a typed
        `Optimized[PromptArtifact]` with deterministic configured-runner scores.
        This does not prove Python-authored worker stages, GEPA search,
        reward-vector execution, or inspectable lineage/evidence.
      - >-
        Partial registered-runner evidence, not acceptance completion:
        `sdk/python/src/leaven/_seam_worker/` is a checked-in private worker
        package, and `leaven._seam_optimize` now configures
        `CommandRunnerStageConfig` to invoke it. `uv run pytest
        tests/test_stage_surface.py -q` proves the worker imports a real
        registered `@lv.runner`, receives a locked `leaven/stage.run` request,
        binds a rollout context, and returns the runner output. `LEAVEN_BIN=...
        uv run python examples/03_prompt_optimize.py` proves
        `lv.optimize(...).run()` uses that route through `leaven seam serve
        --stdio`. This still does not prove nested `leaven/*` callbacks,
        non-runner stages, GEPA search, reward vectors, or inspection.
      - >-
        Partial nested-effect evidence, not acceptance completion:
        `leaven-seam-service` now keeps command-worker pipes open and services
        worker-initiated `leaven/lm.complete` requests while the runner stage is
        active. `cargo test -p leaven-seam-service` covers the Rust service
        callback loop, and `uv run pytest tests/test_stage_surface.py -q`
        covers the checked-in Python worker issuing `cx.lm.complete` and using
        the host response. This still does not prove live LM providers,
        non-runner stages, GEPA search, reward vectors, or inspection.
      - >-
        Partial nested-agent evidence, not live acceptance completion:
        Python runner stages can call `cx.agent.run` with
        `cx.rollout_workspace`, causing the checked-in worker to send nested
        `leaven/agent.run` over the active stage pipe. `uv run pytest
        tests/test_stage_surface.py -q` proves the Python request shape and
        result projection; `cargo test -p leaven-seam-service` proves the Rust
        service handles worker-initiated `agent.run` through configured
        workspace materialization and the fake Codex CLI adapter. This still
        does not prove live `gpt-5.4-mini` inside `lv.optimize(...).run()`,
        cost accounting, reward vectors, GEPA search, or inspection.
      - >-
        Live Codex optimize evidence, not full acceptance completion:
        `sdk/python/examples/11_live_optimize_codex_stage.py` is a live-gated
        Python SDK proof. With `LEAVEN_LIVE_CODEX=1`,
        `LEAVEN_BIN=target/debug/leaven`, and
        `LEAVEN_CODEX_BIN=/Users/darin/.codex/packages/standalone/current/codex`,
        `uv run python examples/11_live_optimize_codex_stage.py` completed
        through `lv.optimize(...).run()` with `run id:
        live_codex_optimize`, `best score: 1.000`, and `agent receipt:
        agentrec_completion`. This proves live `gpt-5.4-mini` Codex execution
        through Python SDK -> durable public seam -> Python stage worker ->
        nested `leaven/agent.run` -> materialized workspace. It still does not
        prove cost accounting, reward vectors, GEPA search, blob readback, or
        inspection.
    closeout_check: Rust-only harnesses and hardcoded demo plans are rejected.

  - id: reward_vector
    claim: >-
      Python scoring/rubric can return and inspect multi-axis reward results,
      not just one scalar exact-match score.
    status: pending
    proof_required:
      kind: sdk_and_seam_contract_tests
      must_exercise:
        - Python reward vector API
        - Plan Result or assessment projection with per-axis values
        - optimizer admission/report semantics for vector rewards
        - backwards-free hard cutover of the previous scalar-only scaffold
    evidence:
      - >-
        Partial SDK evidence, not acceptance completion: Python
        `lv.optimize(...).run()` now executes every configured `Rubric` reward
        after durable-seam runner stage dispatch, preserves per-axis
        `RewardAssessment` rows, and reduces the vector with configured
        weights into the candidate `Score`. `uv run pytest
        tests/test_stage_surface.py -q` covers two registered rewards returning
        both bare floats and `RewardValue` feedback. `LEAVEN_BIN=...
        uv run python examples/03_prompt_optimize.py` proves the real SDK
        optimize path through `leaven seam serve --stdio` returns printed
        reward-vector rows from `result.assessments()`. This still does not
        prove Rust optimizer admission semantics for vector rewards,
        proposal-generating GEPA search, or persisted run readback.
    closeout_check: Scalar-only prompt optimization cannot close SDK maturity.

  - id: codex_materialized_workspace_proposer
    claim: >-
      A Python-configured GEPA proposer/reflector can run Codex with
      `gpt-5.4-mini` in a materialized workspace and submit typed proposals
      through the seam.
    status: pending
    proof_required:
      kind: live_codex_agentic_e2e
      must_exercise:
        - workspace materialization
        - Codex agent runtime adapter configured with `gpt-5.4-mini`
        - "`leaven/agent.run`"
        - typed proposal submission
        - lineage/receipt capture
        - real Codex process/session evidence reached through Leaven's `leaven/agent.run` path, not direct `codex exec` alone and not a fake agent transcript
      companion_no_spend_proof:
        kind: deterministic_agent_runtime_mechanics
        purpose: >-
          Fast local proof for workspace/proposal/receipt mechanics only. This
          proof may keep CI cheap, but it must stay labeled mechanics evidence
          and must not close the live Codex acceptance item.
    evidence:
      - >-
        Partial evidence, not acceptance completion: current AgentBuilder slice
        after `7d21e741`; `sdk/python` test
        `test_agent_builder_run_uses_bound_public_seam_client` proves
        `AgentBuilder.run` lowers through `leaven/agent.run`; live-gated
        `sdk/python/examples/10_live_codex_seam.py` reaches Codex
        `gpt-5.4-mini` through Leaven and returns typed `AgentSession`. Typed
        proposal submission remains unproven.
      - >-
        Live Codex proposer evidence, still not full-goal completion:
        `sdk/python/examples/12_live_optimize_codex_proposer.py` is a
        live-gated Python SDK proof. With `LEAVEN_LIVE_CODEX=1` and
        `LEAVEN_BIN=/Users/darin/src/personal/leaven/target/debug/leaven`,
        `uv run python examples/12_live_optimize_codex_proposer.py` completed
        through `lv.optimize(...).run()` with `run id: live_codex_proposer`,
        `best score: 1.000`, and `iterations: 1`. The configured
        `@lv.proposer` used `cx.parent_workspace`, called `cx.agent.run`
        through nested `leaven/agent.run` with Codex `gpt-5.4-mini`, cited the
        returned agent receipt in `ProposalEffect.change_from_agent_session`,
        and submitted the proposal through `leaven/proposal.submit_batch`.
        This proves the materialized-workspace Codex proposer substrate through
        the Python SDK and durable public seam. It still does not prove proposal
        apply/admission, full GEPA search, provider cost accounting, or durable
        blob/transcript readback.
    closeout_check: A Rust-side hardcoded child prompt, fixed diff, or deterministic fake-agent transcript is not enough.

  - id: real_lm_provider_wiring
    claim: >-
      The same Python stage code can use deterministic/mock LM for mechanics
      tests and a real LM provider for live acceptance evidence through
      `cx.lm.complete`.
    status: pending
    proof_required:
      kind: live_lm_provider_e2e
      must_exercise:
        - leaven-lm provider-neutral request
        - configured real provider construction path
        - real provider call evidence
        - cost/fingerprint/receipt propagation
      companion_no_spend_proof:
        kind: deterministic_lm_runtime_mechanics
        purpose: >-
          Fast local proof for request lowering, cost/receipt shape, and Python
          runtime configuration only. This proof must stay labeled mechanics
          evidence and must not close the live LM acceptance item.
    evidence:
      - >-
        Partial mechanics evidence, not acceptance completion: current
        LmBuilder slice adds `sdk/python` test
        `test_lm_builder_complete_uses_bound_public_seam_client` and a one-off
        local stdio proof where Python `LmBuilder.complete` binds to
        `SeamClient`, spawns `leaven seam serve --stdio --config`, and returns
        mock LM text, usage, cost, and receipt through `leaven/lm.complete`.
        This does not prove engine-supplied `cx.lm` or live LM provider wiring.
      - >-
        Deterministic provider-wiring evidence, not live acceptance completion:
        `leaven-seam-service` now has a private `lm.rs` module that selects
        mock or OpenAI-backed `leaven-lm` runtimes from explicit service config.
        `cargo test -p leaven-seam-service` covers
        `seam_runtime_executes_lm_complete_through_openai_provider_config`,
        which executes `leaven/lm.complete` against a local OpenAI-compatible
        HTTP server through `leaven-lm-openai` and verifies returned text,
        token cost, call receipt, and request model/body. Python
        `tests/test_stage_surface.py` covers `lv.lm.openai(...)` lowering into
        the private seam service config and callback-backed `cx.lm.complete`
        preserving usage and receipt in `LmResponse`.
      - >-
        Live proof scaffold, not executed in this environment:
        `sdk/python/examples/13_live_optimize_openai_lm.py` is a live-gated
        `lv.optimize(...).run()` proof that calls `cx.lm.complete` inside the
        Python runner and returns assistant text, receipt id, usage, cost field,
        and model through the assessment output. Current shell evidence:
        `OPENAI_API_KEY` is unset, so the spend-bearing live OpenAI proof
        remains pending.
    closeout_check: Mock-only LM is acceptable for default CI, but is not live provider proof.

  - id: inspection_and_closeout_truth
    claim: >-
      Completed runs can be inspected from Python with lineage, receipts,
      evidence, cost, and unsupported-provider gaps visible.
    status: pending
    proof_required:
      kind: sdk_inspection_test
      must_exercise:
        - "`lv.runs.open(...)` or equivalent inspection surface"
        - best artifact and score/reward report
        - proposal lineage
        - call/write receipts
        - explicit unsupported/missing-provider statuses
    evidence:
      - >-
        Partial SDK evidence, not acceptance completion: `Optimized` now
        carries in-memory assessment rows from the seam optimize report.
        `result.assessment(case_id)`, `result.assessments(...)`,
        `result.test_assessments()`, and `result.lineage(candidate_id)` no
        longer raise scaffolding errors for the completed in-process result.
        `uv run pytest tests/test_stage_surface.py -q` covers best score,
        assessment score, reward rows, held-out split filtering, and seed
        lineage. This still does not prove `lv.runs.open(...)`, durable blob
        readback, persisted receipts/evidence, or cost accounting.
      - >-
        Partial persisted-inspection evidence, not acceptance completion:
        current `lv.optimize(...).run()` writes an inspectable
        `.leaven/runs/<run_id>/optimized.json` projection, and
        `lv.runs.open(path)` round-trips the completed `Optimized` result with
        best `PromptArtifact`, seed lineage, assessment score, per-reward rows,
        cost status, and unsupported-provider facts. `uv run pytest
        tests/test_run_inspection.py -q` covers the public path
        `lv.optimize(...)` -> persisted result -> `lv.runs.open(...)` plus
        `lv.runs.list_local()`. This still does not prove Rust checkpoint
        readback, durable blob/transcript fetch, provider-authored receipt
        validation, or complete cost accounting.
      - >-
        Flattened inspection evidence, not acceptance completion:
        `lv.runs.inspect(path)` now opens the persisted `Optimized` result and
        returns a typed `RunInspection` with best lineage, visible query/call/write
        receipt ids, public assessment evidence payloads, cost/usage status, and
        unsupported dependency facts. `uv run pytest -q
        tests/test_run_inspection.py tests/test_run_receipt_inspection.py`
        proves persisted readback of assessment write receipts, nested LM call
        receipts, evidence payloads, token totals, and the explicit
        `run.inspection` unsupported fact. This still does not prove Rust graph
        checkpoint readback, blob/transcript fetch, provider-authored receipt
        validation, or complete cost accounting.
    closeout_check: Stdout transcript alone is not run inspection.

proof_denominator:
  focused_first:
    - focused Rust tests for seam runtime/stdio/service crates touched by the implementation
    - focused Python tests/examples under sdk/python for the SDK path
    - one JSON-RPC stdio proof that sends real requests through `leaven seam serve --stdio`
    - one Python E2E proof that invokes `lv.optimize(...).run()` through the durable server path
  final_repo_gate:
    - >-
      Run broad repo checks only after the real surface exists or when the repo
      contract requires final completion evidence; do not substitute broad gates
      for focused product proof.

explicit_non_goals:
  - Upstream Agent Client Protocol conformance as a V1 requirement.
  - MCP-over-seam in V1.
  - Python-authored optimizer strategy loops.
  - Provider credentials or paid live calls in default tests.
  - Windows wheel support in this goal.
  - Paper-close EvoSkill reproduction in this goal; this goal builds the SDK/seam path it will need.
  - Claiming every `leaven/*` method is production-ready if some providers remain explicitly unsupported.
  - Completing every future Python SDK feature beyond the foundation needed to prove the public-seam E2E route.

decision:
  status: set_goal
  reason: >-
    This handoff intentionally rejects the reward-hack completion path. The
    user agreed that completion means the Python SDK product surface drives a
    real optimization through the durable Leaven public seam, with reward
    vectors, Codex gpt-5.4-mini materialized-workspace agent work,
    live-provider-backed LM wiring, and honest inspection evidence. Live proof
    spend is approved up to 5 USD total; deterministic/mock paths remain
    mechanics evidence only. The goal is the latest Python-plan foundation
    slice, not the entire eventual SDK roadmap.
