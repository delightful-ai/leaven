objective_name: evoskill_paper_close_replication
created_at: "2026-05-22T08:59:00Z"
status: ready_to_goal
decision: set_goal

original_intent:
  - get Leaven to paper-close EvoSkill replication, not just product-proof
  - preserve train/validation/test semantics even when exact split membership is unavailable
  - avoid fake proofs and proxy demos as completion evidence

designed_surface:
  governing_ledgers:
    - docs/working-memory/skill-paper-replication.md
    - docs/working-memory/evoskill-replication.md
  governing_specs:
    - docs/specs/agentic_skill_optimization_primitives.md
    - docs/specs/agentic_task_execution_substrate.md
    - docs/specs/firkin_git_workspace_backend.md
  intended_user_workflow:
    - choose a pinned EvoSkill source/corpus manifest
    - materialize OfficeQA and SealQA cases into Leaven case envelopes
    - declare exact or paper-close train/validation/test splits with fingerprints
    - run the EvoSkill multi-iteration git-program/frontier loop
    - emit baseline/optimized split reports plus exactness gaps and ablations
  reusable_substrate:
    - leaven-eval SourceRowManifest and split builders
    - leaven-artifact-git and leaven-workspace-git materialization/readback
    - leaven-population TopKFrontier and TopKParentSelector
    - agentic Git bridge and evidence/checkpoint/report surfaces

intent_preservation:
  preserved_if:
    - the run denominator is OfficeQA/SealQA paper-close, not a tiny fixture
    - source pins, split fingerprints, scorer versions, provider/model pins, and exactness gaps are report-visible
    - multi-iteration parent selection, train sampling, child validation, frontier admission, weakest eviction, and checkpoint/resume are exercised
  not_preserved_by:
    - P5 one-iteration fixture alone
    - local Git trust benchmark alone
    - fake runtime or single-sample inspect path
    - topology/just check without paper denominator
    - live Codex smoke without paper loaders/splits/scorer/reporting

misleading_proxy_proofs:
  - proxy: P5 live fixture completes.
    why_not: It is product wiring evidence, not OfficeQA/SealQA paper-close replication.
  - proxy: Git materialization/readback benchmarks pass.
    why_not: They prove substrate isolation and performance, not EvoSkill loop semantics.
  - proxy: A fake-runtime loop admits a child.
    why_not: Useful mechanics proof, but not live agent behavior or paper scores.
  - proxy: One OfficeQA or SealQA sample can be inspected.
    why_not: It does not prove split construction, scorer distribution, or held-out reporting.
  - proxy: `just check` passes.
    why_not: It proves repo health, not paper-close reproduction.

acceptance_path:
  - id: replica_manifest
    status: proven
    requirement: >
      Durable manifest names source revisions, corpus fingerprints, model/provider
      pins, scorer version, split mode, frontier config, epoch schedule, and
      paper-close/exactness classification.
    evidence:
      - examples/p5_skill_paper_reproductions/src/evoskill.rs
      - examples/p5_skill_paper_reproductions/tests/evoskill_manifest.rs
      - target/evoskill-paper-close/replica-manifest.json after running `just evoskill-paper-manifest`
      - "Manifest schema v13 includes a tested source_universe mapping from dataset ids to source artifacts, source revisions when available, paper rows, materialized rows, source-row fingerprints, split ids, split exactness, split acceptance status, and blockers. Source revisions separately record local checkout head, branch, origin URL, no-network remote-probe status, unresolved paper-release ref/head, and source_pin blockers when no source pin manifest is present. Optional schema-v1 source pin manifests at tmp/replication/evoskill/source_pin_manifest.json validate every known local checkout id/path/head/branch/origin and remove only source_pin; mismatches fail the manifest build instead of becoming fallback evidence. The CLI flag --write-local-source-pin-manifest and `just evoskill-paper-pin-local-sources` provide the no-spend operator path for choosing the current local-checkout denominator before writing the manifest. Substitute split materializations carry role-level source-id manifests and fingerprints for train/validation/held-out membership, optional paper-declared OfficeQA/SealQA source-id split manifests are lowered through ExplicitSplitBuilder when present, and optional schema-v1 split policy manifests at tmp/replication/evoskill/split_policy_manifest.json validate every current substitute split fingerprint before marking it accepted as a paper-close substitute. Optional BrowseComp transfer JSONL at tmp/replication/evoskill/browsecomp/transfer_sample.jsonl validates as a strict 128-row held-out transfer denominator before removing only the BrowseComp sample source blocker. It also reports OfficeQA baseline and skill-merge paper targets, including both 67.9 prose and 68.1 table exact-match candidates, plus SealQA 26.6 -> 38.7 judge-accuracy and BrowseComp 43.5 -> 48.8 transfer-accuracy headline targets as typed paper_result_targets instead of leaving paper targets as prose. Typed source_blockers classify unresolved source policy, missing OfficeQA category/exact split artifacts when no accepted substitute policy exists, missing SealQA exact split membership when no accepted substitute policy exists, and absent BrowseComp transfer source as source blockers with checked local candidate-path evidence, including existence/file/directory/bytes/hash fields where applicable; exact split, source pin, split policy, and BrowseComp sample manifests remove only the blockers they validate. When all source blockers are removed, the top-level exactness advances only to paper_close_candidate, not paper_close, while live/judge blockers and missing scores remain explicit. The SealQA judge template pin carries the checked paper-source artifact existence, size, and hash. This proves the declared no-spend source universe, local source identity, refusal-capable local source pin ingestion/operator path, auditable substitute/exact split membership path, explicit paper-close substitute acceptance path, BrowseComp denominator ingestion path, reported-target visibility, source-backed judge template pinning, and source-blocked classification only; local-checkout pinning is still not paper-release or remote-current proof, accepted substitutes are still not paper-exact, live judge scoring and all Leaven scores remain explicit."
      - "`--write-browsecomp-public-transfer-sample` and `just evoskill-paper-browsecomp-public-sample <csv>` can derive the strict BrowseComp JSONL sidecar from a local official simple-evals encrypted CSV using Rust decryption and deterministic topic-stratified SHA-256 selection. This can remove the BrowseComp source blocker as a paper-close substitute only; it is not the paper author's exact sample."
  - id: source_and_split_materialization
    status: proven
    requirement: >
      OfficeQA and SealQA inputs lower into Leaven case envelopes with stable row
      identity, hidden targets, and exact or documented paper-close
      train/validation/test split fingerprints.
    evidence:
      - examples/p5_skill_paper_reproductions/src/evoskill.rs
      - examples/p5_skill_paper_reproductions/tests/evoskill_materialization.rs
      - "`cargo test -p p5_skill_paper_reproductions --test evoskill_materialization`"
      - "OfficeQA is materialized as a documented difficulty-stratified substitute when its exact split manifest is absent; SealQA is materialized from Parquet through leaven-eval-parquet with row-order source ids because observed canary values are not unique, plus a documented row-order 10 percent train / held-out substitute when its exact split manifest is absent. Optional schema-v1 source-id split manifests at tmp/replication/evoskill/officeqa/paper_split_manifest.json and tmp/replication/evoskill/sealqa/paper_split_manifest.json validate dataset id, nonempty required roles, known source ids, full row-universe coverage, and disjointness via ExplicitSplitBuilder before they can be recorded as paper_exact. Optional schema-v1 split policy manifests at tmp/replication/evoskill/split_policy_manifest.json validate all current substitute split fingerprints before they can be accepted as paper-close substitutes. Optional BrowseComp transfer JSONL validates the 128-row held-out denominator and refuses malformed row counts, duplicate source ids, blank rows, empty required fields, and unknown JSON fields. Each split reports role-level source-id membership and source-id fingerprints, so train/validation/held-out membership is auditable without exposing targets. This proves no-spend materialization plus refusal-capable exact, paper-close-substitute, and BrowseComp transfer-denominator ingestion paths only; accepted substitutes remain exactness gaps, and missing real paper split files, SealQA judge scoring, transferred-skill execution, and live scores remain separate blockers."
      - "The official public BrowseComp CSV writer path is tested against encrypted local fixtures and CLI mutation order, including refusal of insufficient rows. It produces a strict sidecar before split-policy validation so BrowseComp substitute split fingerprints can be accepted in the same operator command."
      - "`just evoskill-paper-runner-inputs` is the Rust no-spend operator path for materializing answer-free OfficeQA/SealQA runner inputs. It writes schema-v1 runner_input_manifest.json plus per-slot JSONL artifacts bound to the current manifest/scorer fingerprints, split fingerprints, role source-id fingerprints, and unreported materialized OfficeQA/SealQA slots. Artifact rows contain source ids and runner-visible input fields only; targets, references, predictions, scores, and BrowseComp transfer rows are absent. This proves run-input materialization only; it does not run an agent, score outputs, call a judge, approve spend, or prove live/paper-close results."
      - "`just evoskill-paper-runner-outputs <outputs.jsonl>` is the Rust no-spend operator path for importing predictions produced from those runner-input artifacts. It consumes strict rows keyed by dataset/split role/candidate/source id plus the current runner input artifact SHA-256, validates runner_input_manifest.json, artifact integrity, and exact source-id coverage, scores OfficeQA rows through the Rust scorer, and writes SealQA judge-request batches for future approved judging. This proves runner-output ingestion and input-output provenance binding only; it does not run an agent, call or approve a judge, import judged SealQA scores, or prove paper-close results."
      - "`just evoskill-paper-live-run-request` is the Rust no-spend operator path for writing a bounded live-run approval packet from the current runner_input_manifest.json. It validates runner input artifact integrity and row counts, binds manifest/scorer fingerprints, runtime/model pins, live_run_spend_approval blockers, input artifact hashes, and requested generation-call counts, and explicitly keeps provider_calls_allowed and judge_calls_allowed false. This proves approval-packet materialization only; it does not probe credentials, approve spend, run an agent, call a judge, import live outputs, or prove paper-close results."
  - id: paper_scorer
    status: proven
    requirement: >
      EvoSkill tolerances, weighted score, failure threshold, feedback rows, and
      failure extraction are implemented in Rust and tested without Python glue.
    evidence:
      - examples/p5_skill_paper_reproductions/src/evoskill.rs
      - examples/p5_skill_paper_reproductions/tests/evoskill_scorer.rs
      - examples/p5_skill_paper_reproductions/tests/evoskill_feedback.rs
      - "`cargo test -p p5_skill_paper_reproductions --test evoskill_scorer`"
      - "`cargo test -p p5_skill_paper_reproductions --test evoskill_feedback`"
      - "SealQA's paper auto-grader placeholder is now pinned as a fingerprinted no-spend judge template/request surface in the scorer manifest, and the template pin carries checked source-artifact existence, size, and SHA-256 evidence. The request builder takes the pinned template manifest so request fingerprints cannot drift from the report. This proves prompt/request materialization only; an approved live LLM-as-judge scored run remains blocked as sealqa_judge_scored_run."
      - "`just evoskill-paper-score-officeqa <predictions.jsonl>` is the Rust operator path for OfficeQA scorer replay. It consumes strict prediction JSONL, refuses blocked slots, requires exact role membership for the current split role, computes row scores with the Rust scorer, writes checked score-evidence JSONL without ground-truth/reference fields, writes schema-v5 score_result_manifest.json, and regenerates the final report through the normal importer. This proves OfficeQA score-sidecar generation only; it does not run a paper agent or resolve missing split/source proof."
      - "`just evoskill-paper-sealqa-judge-requests <predictions.jsonl>` is the Rust no-spend operator path for materializing pinned SealQA judge requests before any approved judge execution. It consumes strict prediction JSONL keyed by dataset/split role/candidate/source id, refuses source/split-blocked or already-reported slots, requires exact role coverage, writes schema-v1 sealqa_judge_request_manifest.json plus judge-only request JSONL bound to the current manifest/scorer fingerprints and pinned judge-template fingerprint, and regenerates the manifest/report without score evidence. This proves request-batch materialization only; it does not run a judge, approve spend, clear sealqa_judge_scored_run, or provide runner input."
      - "`just evoskill-paper-score-sealqa <judged_rows.jsonl> <approval_id>` is the Rust no-spend operator path for importing already-approved SealQA external judge rows. It consumes strict judged JSONL keyed by dataset/split role/candidate/source id with prediction, score, and the run's row-level judge_template_fingerprint; refuses missing approval ids, stale template fingerprints, non-judge/source-split-blocked slots, duplicate/missing source ids, and out-of-range scores; writes checked score-evidence JSONL plus schema-v5 score_result_manifest.json; and regenerates the final report through the normal importer. This proves SealQA approved-output import only; it does not run a judge, approve spend, resolve source/split proof, or make partial SealQA rows prove the whole scorer gate."
      - "Score writers append disjoint score-slot batches to an existing validated score_result_manifest.json, refuse duplicate slot keys before writing new evidence artifacts, sum costs, and then rerun the normal importer. This lets OfficeQA scorer replay and approved SealQA judge outputs coexist in one final report without silently replacing earlier evidence."
  - id: full_loop_mechanics
    status: proven
    requirement: >
      Multi-iteration git-program loop exercises train sampling, feedback
      history, parent selection, child proposal/readback, scalar frontier admission,
      top-k frontier, weakest eviction, and checkpoint/resume.
    evidence:
      - examples/p5_skill_paper_reproductions/src/evoskill.rs
      - examples/p5_skill_paper_reproductions/tests/evoskill_loop_mechanics.rs
      - "`cargo test -p p5_skill_paper_reproductions --test evoskill_loop_mechanics`"
      - "Covers no-spend train sampling, feedback history, parent selection, agentic Git workspace child proposal/readback, GitProgramArtifact child lineage, full OfficeQA validation-role traversal before frontier admission, scalar top-k admission/ignore/weakest replacement, and checkpoint/resume. The loop report carries a typed run_manifest that binds the mechanics evidence to the replica manifest fingerprint, scorer fingerprint, OfficeQA source-row fingerprint, substitute train split fingerprint, train role source-id fingerprint, validation split fingerprint, validation role source-id fingerprint, schedule, frontier policy, checkpoint boundary, Git identity mode, fake runtime, and fixed validation-score source. The final-report path materializes OfficeQA/SealQA once, builds the manifest from that source set, and runs the loop from the same OfficeQA materialization; the loop also refuses source/split/train-role/validation-role drift against the embedded manifest. It is still not live provider, SealQA judge, transferred BrowseComp skill, validation-score quality, or paper-score evidence."
  - id: live_small_run
    status: blocked_by_approval
    requirement: >
      At least one bounded live run uses the same replica harness and labels all
      remaining exactness gaps; no provider spend happens without approval.
    evidence:
      - examples/p5_skill_paper_reproductions/src/evoskill.rs
      - examples/p5_skill_paper_reproductions/tests/evoskill_final_report.rs
      - "`cargo test -p p5_skill_paper_reproductions --test evoskill_final_report`"
      - "Final report schema v19 carries a live_run_gate with status blocked_no_spend_approval, candidate runtime role/model, credential_probe_status not_probed_no_spend_default, spend_approval_status not_approved, and the live_run_spend_approval blocker. This is an explicit approval gate only; no provider call, credential probe, or live score evidence has happened."
  - id: final_report_truth
    status: proven
    requirement: >
      Report contains baseline/optimized train, validation, held-out test,
      paper-close classification, source/split/scorer fingerprints, costs,
      errors, and ablation status.
    evidence:
      - examples/p5_skill_paper_reproductions/src/evoskill.rs
      - examples/p5_skill_paper_reproductions/tests/evoskill_final_report.rs
      - "`cargo test -p p5_skill_paper_reproductions --test evoskill_final_report`"
      - "`just evoskill-paper-final-report` writes target/evoskill-paper-close/final-report.json"
      - "`just evoskill-paper-score-officeqa <predictions.jsonl>` writes tmp/replication/evoskill/score_result_manifest.json from strict OfficeQA prediction rows and then writes the normal target/evoskill-paper-close/final-report.json, but only for unblocked materialized OfficeQA score slots."
      - "The OfficeQA and SealQA score writers merge disjoint schema-v5 score batches instead of overwriting the sidecar; duplicate slot replacement is refused and requires rebuilding the sidecar explicitly."
      - "Final report schema v19 is a no-spend truth surface: it contains a manifest fingerprint, loop run manifest, baseline/optimized OfficeQA and SealQA train/validation/held-out score slots where the dataset defines those roles, BrowseComp held-out transfer score slots that are source-blocked when the sample is absent and unscored NotRun when the strict 128-row JSONL denominator is present, first-class exactness_gaps, source identity/status fields, typed source_blockers from the embedded manifest, scorer and source-backed judge-template fingerprints, OfficeQA/SealQA/BrowseComp paper result targets, zero default costs unless a strict score result sidecar is present, blockers, ablation statuses, an explicit live-run approval gate, typed paper_close_gates, typed proxy_rejection_gates, and optional score_result_manifest evidence. The exactness_gaps keep local source pins as paper_release_unverified and accepted OfficeQA/SealQA/BrowseComp substitutes as accepted_paper_close_substitute even after source blockers are resolved, so paper_close_candidate remains distinct from paper-exact. The paper_close_gates separate proven manifest/report/loop/proxy-closeout surfaces from source-blocked source/split materialization and approval-blocked live/judge paths. Each materialized score slot carries split exactness, split fingerprint, role-level source-id fingerprint, paper_result_target_ids, and null score_evidence_id, score_evidence_kind, score_evidence_approval_id, plus score_evidence_artifact fields directly, so blocked or unscored rows are auditable without joining back through code. Schema-v5 score sidecars can fill reported scores only when the current manifest/scorer/slot fingerprints, expected row counts, scored row counts, resolved slot blockers, nonempty score evidence id, checked JSONL evidence artifact hash/bytes, exact role source-id membership, aggregate recomputation, and an explicit score_evidence_kind match. OfficeQA requires rust_scorer_replay and scorer replay; conservative BrowseComp exact checks use exact_answer_replay; approved SealQA or official BrowseComp judge outputs use external_judge_run with a nonempty score_evidence_approval_id, row-level judge_template_fingerprint values matching the pinned scorer template, and reported LLM-call cost. Stale result files, tampered evidence artifacts, fabricated aggregates, OfficeQA predictions whose row scores do not match the scorer, BrowseComp row scores that fail the exact-answer check, or external judge rows without approval/template metadata fail the report build instead of becoming score evidence. The BrowseComp exact-answer check is an anti-fake no-spend sidecar guard, not the official simple-evals judge path. When the split policy sidecar validates current substitutes, OfficeQA score slots become unscored NotRun paper-close-substitute denominator slots and SealQA slots drop the split blocker while retaining the judge-scored-run blocker; missing scores stay null. When source pins, accepted substitutes, and a BrowseComp transfer denominator remove source blockers, the report top-level exactness becomes paper_close_candidate and ablation rows relabel remaining work as approval-blocked instead of citing absent denominator sources. After score sidecar import, report-level errors, ablations, and the paper_scorer gate are recomputed from score evidence: partial SealQA judge imports keep sealqa_judge_scored_run blocked, while complete approved external_judge_run evidence for every SealQA slot can clear that blocker and prove the scorer gate without clearing the separate live_run_spend_approval gate. The loop run manifest is asserted against the embedded OfficeQA materialization, train split, train role fingerprint, validation role fingerprint, and validation row count so loop evidence cannot silently diverge from the reported denominator. Blocked metrics remain missing rather than fake scores, SealQA slots explicitly carry the judge-scored-run blocker until complete approved judge evidence exists, and P5 fixtures, Git trust benchmarks, fake-runtime loops, single-sample inspection, and just check/topology are explicitly rejected as completion evidence. It is still not live provider, validation-score evidence, official BrowseComp judge evidence, transferred BrowseComp score, paper-exact evidence, or paper-close evidence."
      - "Score result sidecars cannot resolve source or split provenance blockers. The importer rejects claims to clear blockers such as officeqa_category_split_manifest, officeqa_exact_split_membership, or sealqa_split_manifest; those must be resolved by source pins, exact split manifests, or accepted substitute split policy. The only score-resolvable blocker today is sealqa_judge_scored_run, and only approved SealQA external_judge_run evidence with matching pinned judge-template fingerprints can clear it."
      - "The SealQA score writer is now an operator-safe producer for approved external_judge_run entries: it writes only from strict judged rows with an explicit approval id and current pinned judge-template fingerprint, preserves the checked evidence artifact, and relies on the shared final-report importer for blocker, source-id, aggregate, and cost validation."

explicit_non_goals:
  - do not claim paper-exact when only paper-close is proven
  - do not implement Leaven-owned replication logic in Python
  - do not bake EvoSkill policy into leaven-engine
  - do not expose hidden targets, exact answers, or held-out feedback to runners
  - do not spend provider credits or touch destructive source/dataset state without approval
