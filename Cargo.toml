# `codegen-backend` profile key is nightly-only; the repo pins nightly via
# `rust-toolchain.toml` so the dev profile can select the Cranelift backend.
cargo-features = ["codegen-backend"]

[workspace]
resolver = "3"
# Bare `cargo build`/`check`/`nextest` (no `--workspace`) skip the example
# milestones; `just check`/`just test` still cover them via `--workspace`.
default-members = ["crates/*"]
members = [
    "crates/leaven",
    "crates/leaven-agent",
    "crates/leaven-agent-command",
    "crates/leaven-agent-claude-code",
    "crates/leaven-agent-codex",
    "crates/leaven-agent-codex-app-server",
    "crates/leaven-agent-codex-cli",
    "crates/leaven-cli",
    "crates/leaven-agent-opencode",
    "crates/leaven-agentic",
    "crates/leaven-agentic-skill",
    "crates/leaven-artifact-git",
    "crates/leaven-artifact-jj",
    "crates/leaven-artifact-skill",
    "crates/leaven-artifacts",
    "crates/leaven-cuda",
    "crates/leaven-core",
    "crates/leaven-engine",
    "crates/leaven-evidence",
    "crates/leaven-eval",
    "crates/leaven-gepa",
    "crates/leaven-kernel",
    "crates/leaven-lm",
    "crates/leaven-lm-anthropic",
    "crates/leaven-lm-cache",
    "crates/leaven-lm-local",
    "crates/leaven-lm-mock",
    "crates/leaven-lm-openai",
    "crates/leaven-mipro",
    "crates/leaven-population",
    "crates/leaven-preference",
    "crates/leaven-python",
    "crates/leaven-render",
    "crates/leaven-run",
    "crates/leaven-stage",
    "crates/leaven-std",
    "crates/leaven-store",
    "crates/leaven-store-file",
    "crates/leaven-store-inline",
    "crates/leaven-store-object",
    "crates/leaven-store-sqlite",
    "crates/leaven-surface",
    "crates/leaven-textgrad",
    "crates/leaven-trace",
    "crates/leaven-workspace",
    "crates/leaven-workspace-docker",
    "crates/leaven-workspace-e2b",
    "crates/leaven-workspace-firecracker",
    "crates/leaven-workspace-git",
    "crates/leaven-workspace-k8s",
    "crates/leaven-workspace-local",
    "crates/leaven-derive",
    "examples/p0_graph_skeleton",
    "examples/p1_keep_best",
    "examples/p2_pairwise_tournament",
    "examples/p3_gepa_parity",
    "examples/p4_meta_harness_lite",
    "examples/p5_evoskill_iteration",
    "examples/p6_optimizer_policy_self_opt",
    "examples/p7_self_optimization_kernel",
    "examples/p8_aime_gepa",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/darinkishore/leaven"

[profile.release]
debug = "line-tables-only"

# Dev builds default to full debuginfo (=2), which is slow to emit and bloats
# target/. Line tables keep backtraces useful while cutting build time + size.
#
# Workspace crates compile through the Cranelift backend (faster codegen for
# unoptimized builds). It applies to workspace members only — every `leaven-*`
# crate is `unsafe_code = "forbid"`, so none carry inline asm Cranelift's
# assembler rejects. Dependencies stay on LLVM via the `*` override below:
# they build once and cache, and some (e.g. `constant_time_eq`) use asm
# extensions Cranelift cannot assemble.
[profile.dev]
debug = "line-tables-only"
codegen-backend = "cranelift"

[profile.dev.package."*"]
codegen-backend = "llvm"

# Coverage profile: `scripts/coverage-gate.py` builds under `--profile coverage`.
# `cargo llvm-cov` instruments with `-Cinstrument-coverage`, which the Cranelift
# backend does not support, so workspace crates are pinned back to LLVM here.
[profile.coverage]
inherits = "dev"
codegen-backend = "llvm"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allowed pedantic lints (mirrors papers_rs)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
map_unwrap_or = "allow"
implicit_hasher = "allow"
if_not_else = "allow"
default_trait_access = "allow"
similar_names = "allow"
literal_string_with_formatting_args = "allow"

# Allowed nursery lints (mirrors papers_rs)
option_if_let_else = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
string_lit_as_bytes = "allow"
equatable_if_let = "allow"

