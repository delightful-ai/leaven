[workspace]
resolver = "3"
# Bare `cargo build`/`check` and the default `just` gates skip the example
# milestones. Run them explicitly through the `just milestone-*` recipes.
default-members = ["crates/*"]
members = [
    "crates/leaven",
    "crates/leaven-agent",
    "crates/leaven-agent-command",
    "crates/leaven-agent-codex-app-server",
    "crates/leaven-agent-codex-cli",
    "crates/leaven-acp",
    "crates/leaven-cli",
    "crates/leaven-agentic",
    "crates/leaven-agentic-agent-kit",
    "crates/leaven-agentic-git",
    "crates/leaven-agentic-skill",
    "crates/leaven-artifact-agent-kit",
    "crates/leaven-artifact-git",
    "crates/leaven-artifact-jj",
    "crates/leaven-artifact-skill",
    "crates/leaven-core",
    "crates/leaven-engine",
    "crates/leaven-evidence",
    "crates/leaven-eval",
    "crates/leaven-eval-parquet",
    "crates/leaven-gepa",
    "crates/leaven-gepa-agentic-git",
    "crates/leaven-gepa-agentic-skill",
    "crates/leaven-kernel",
    "crates/leaven-lm",
    "crates/leaven-lm-cache",
    "crates/leaven-lm-mock",
    "crates/leaven-lm-openai",
    "crates/leaven-population",
    "crates/leaven-preference",
    "crates/leaven-public-seam",
    "crates/leaven-run",
    "crates/leaven-stage",
    "crates/leaven-std",
    "crates/leaven-store",
    "crates/leaven-store-file",
    "crates/leaven-store-inline",
    "crates/leaven-surface",
    "crates/leaven-workspace",
    "crates/leaven-workspace-firkin",
    "crates/leaven-workspace-git",
    "crates/leaven-workspace-local",
    "examples/p0_graph_skeleton",
    "examples/p1_keep_best",
    "examples/p2_pairwise_tournament",
    "examples/p3_gepa_parity",
    "examples/p4_meta_harness_lite",
    "examples/p5_evoskill_iteration",
    "examples/p5_skill_paper_reproductions",
    "examples/p6_optimizer_policy_self_opt",
    "examples/p7_self_optimization_kernel",
    "examples/p8_aime_gepa",
    "examples/trace2skill_spreadsheetbench",
    "xtask",
]
# Vendored Python-scaffold reference repos under docs/specs/leaven_py/repos/
# contain their own Cargo.toml files (BAML's engine, temporal-python-sdk's
# bridge, etc.). Excluding them prevents cargo from auto-detecting and
# attempting to build them as part of this workspace.
exclude = ["docs/specs/leaven_py/repos"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/darinkishore/leaven"

[profile.release]
debug = "line-tables-only"

# Dev builds default to full debuginfo (=2), which is slow to emit and bloats
# target/. Line tables keep backtraces useful while cutting build time + size.
# Many codegen units favor local edit/compile/test loops over dev binary
# quality; release builds keep their separate profile.
#
# Keep the default LLVM backend. Local measurement on the `leaven-run` test
# binaries showed no meaningful wall-time win from Cranelift, and the pinned
# nightly ICEs when incremental compilation and the parallel rustc frontend are
# combined. Keep incremental off in the profile so clean local commands do not
# need `CARGO_INCREMENTAL=0` wrappers.
[profile.dev]
debug = "line-tables-only"
incremental = false
codegen-units = 1024

# Coverage profile: `scripts/coverage-gate.py` builds under `--profile coverage`.
[profile.coverage]
inherits = "dev"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allowed pedantic lints (mirrors papers_rs)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
map_unwrap_or = "allow"
implicit_hasher = "allow"
if_not_else = "allow"
default_trait_access = "allow"
similar_names = "allow"
literal_string_with_formatting_args = "allow"

# Allowed nursery lints (mirrors papers_rs)
option_if_let_else = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
string_lit_as_bytes = "allow"
equatable_if_let = "allow"

[workspace.dependencies]
leaven-core = { path = "crates/leaven-core", version = "0.0.0" }
leaven = { path = "crates/leaven", version = "0.0.0", default-features = false }
leaven-engine = { path = "crates/leaven-engine", version = "0.0.0" }
leaven-std = { path = "crates/leaven-std", version = "0.0.0" }
leaven-workspace = { path = "crates/leaven-workspace", version = "0.0.0" }
leaven-agent = { path = "crates/leaven-agent", version = "0.0.0" }
leaven-agent-command = { path = "crates/leaven-agent-command", version = "0.0.0" }
leaven-agent-codex-cli = { path = "crates/leaven-agent-codex-cli", version = "0.0.0" }
leaven-acp = { path = "crates/leaven-acp", version = "0.0.0" }
leaven-agentic = { path = "crates/leaven-agentic", version = "0.0.0" }
leaven-agentic-agent-kit = { path = "crates/leaven-agentic-agent-kit", version = "0.0.0" }
leaven-agentic-git = { path = "crates/leaven-agentic-git", version = "0.0.0" }
leaven-agentic-skill = { path = "crates/leaven-agentic-skill", version = "0.0.0" }
leaven-artifact-agent-kit = { path = "crates/leaven-artifact-agent-kit", version = "0.0.0" }
leaven-artifact-git = { path = "crates/leaven-artifact-git", version = "0.0.0" }
leaven-artifact-jj = { path = "crates/leaven-artifact-jj", version = "0.0.0" }
leaven-artifact-skill = { path = "crates/leaven-artifact-skill", version = "0.0.0" }
leaven-evidence = { path = "crates/leaven-evidence", version = "0.0.0" }
leaven-eval = { path = "crates/leaven-eval", version = "0.0.0" }
leaven-eval-parquet = { path = "crates/leaven-eval-parquet", version = "0.0.0" }
leaven-gepa = { path = "crates/leaven-gepa", version = "0.0.0" }
leaven-gepa-agentic-skill = { path = "crates/leaven-gepa-agentic-skill", version = "0.0.0" }
leaven-kernel = { path = "crates/leaven-kernel", version = "0.0.0" }
leaven-lm = { path = "crates/leaven-lm", version = "0.0.0" }
leaven-lm-cache = { path = "crates/leaven-lm-cache", version = "0.0.0" }
leaven-lm-openai = { path = "crates/leaven-lm-openai", version = "0.0.0" }
leaven-population = { path = "crates/leaven-population", version = "0.0.0" }
leaven-preference = { path = "crates/leaven-preference", version = "0.0.0" }
leaven-public-seam = { path = "crates/leaven-public-seam", version = "0.0.0" }
leaven-run = { path = "crates/leaven-run", version = "0.0.0" }
leaven-stage = { path = "crates/leaven-stage", version = "0.0.0" }
leaven-store = { path = "crates/leaven-store", version = "0.0.0" }
leaven-store-file = { path = "crates/leaven-store-file", version = "0.0.0" }
leaven-store-inline = { path = "crates/leaven-store-inline", version = "0.0.0" }
leaven-surface = { path = "crates/leaven-surface", version = "0.0.0" }
leaven-workspace-firkin = { path = "crates/leaven-workspace-firkin", version = "0.0.0" }
leaven-workspace-git = { path = "crates/leaven-workspace-git", version = "0.0.0" }
leaven-workspace-local = { path = "crates/leaven-workspace-local", version = "0.0.0" }

# error handling
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# serialization
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yml = "0.0.12"
toml = "0.9"
jsonschema = { version = "0.46.5", default-features = false }
csv = "1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
calamine = "0.35.0"
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
parquet = { version = "58.3.0", default-features = false, features = ["arrow", "zstd", "snap"] }

# ids and time
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }

# hashing
sha2 = "0.10"
hex = "0.4"
blake3 = "1"
jcs-canonicalize = "0.2.1"

# ordered maps
indexmap = { version = "2", features = ["serde"] }
ordered-float = { version = "4", features = ["serde"] }
smallvec = { version = "1", features = ["serde"] }
bytes = "1"
parking_lot = "0.12"
rand = "0.8"
tokio = { version = "1", features = ["rt", "macros", "process", "fs", "time", "sync"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# tracing
tracing = "0.1"

# testing
proptest = "1"
expect-test = "1"
trybuild = "1"
futures = "0.3"
tempfile = "3.27.0"
proc-macro2 = "1"
quote = "1"
syn = "2"
